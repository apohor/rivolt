# xcodegen manifest — the `.xcodeproj` is generated from this file and
# is NOT checked in. Regenerate after any change here or any time you
# add / rename a source file:
#
#     cd ios && xcodegen
#
# Declarative-project-definition-over-pbxproj-diff keeps merge
# conflicts out of Xcode's project file, which is the single worst
# thing to review in a PR.
name: Rivolt
options:
  # iOS 17.4: @Observable, and ASWebAuthenticationSession's https
  # callback (Universal Link sign-in on rivolt.dev, design §2). A
  # greenfield surface; no back-compat reason to go older.
  deploymentTarget:
    iOS: "17.4"
  # Bundle identifier dev.rivolt.app (Apple developer setup, N28): the key input to codesigning + App Store
  # Connect later. Keep it in reverse-DNS and stable from day one.
  bundleIdPrefix: dev.rivolt.app
  createIntermediateGroups: true
  defaultConfig: Debug

# Semantic version lives here so bumping it is a one-line PR.
# Xcode reads MARKETING_VERSION + CURRENT_PROJECT_VERSION at build.
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The language mode, not the compiler: Xcode 26's toolchain is Swift 6,
    # compiling this code in Swift 5 mode. The setting only accepts 4.0, 4.2,
    # 5.0 or 6.0 (the scaffold's "5.10" is rejected). Moving to 6.0 (strict
    # concurrency checking) is its own change.
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    # Required Info.plist keys that xcodegen will emit for every
    # target that references this settings block.
    GENERATE_INFOPLIST_FILE: YES
    # Export-compliance shortcut: we only use HTTPS + standard
    # iOS crypto, so we qualify for the exemption. Skipping this
    # flag means answering the yes/no question on every TestFlight
    # upload — not relevant yet, but costs nothing to set now.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # UIKit scene delegates removed; SwiftUI App lifecycle only.
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # Rivolt only runs portrait on phone; landscape comes later
    # when the drive-detail maps need it.
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"

targets:
  Rivolt:
    type: application
    platform: iOS
    sources:
      - path: Rivolt
    dependencies:
      - target: RivoltNotificationService
        embed: true
      - target: RivoltWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rivolt.app
        PRODUCT_NAME: Rivolt
        INFOPLIST_KEY_CFBundleDisplayName: Rivolt
        # The app starts the charging Live Activity.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # iPhone only. Without this the app is iPhone+iPad and App Store
        # validation demands iPad icons and iPad multitasking orientations
        # (ios-v0.1.0 was rejected for both). Per target: XcodeGen's iOS
        # preset sets "1,2" on every target, which overrides a project-level
        # value (ios-v0.1.1 still came out [1, 2]).
        TARGETED_DEVICE_FAMILY: "1"
        # Names the AppIcon set so actool emits CFBundleIconName and the
        # sized icons; App Store validation rejects the build without them.
        # The 1024 PNG is a placeholder from web/public/icon-maskable-512.png
        # (upscaled, alpha removed: App Store icons must be opaque).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The server defaults to https://rivolt.dev in code (ServerURL);
        # "Other server" on the sign-in screen changes it.
      configs:
        # Push and the shared Keychain group need a signed build (TestFlight):
        # the entitlements apply to Release only, so the unsigned simulator
        # build CI runs keeps working with the Keychain as before.
        Release:
          CODE_SIGN_ENTITLEMENTS: Rivolt/Rivolt.entitlements

  # The Notification Service Extension: swaps the generic APNs alert for the real
  # text, fetched from Rivolt (design §3, DA condition 6). It shares the Keychain
  # token store and the fetch logic with the app, and nothing else.
  RivoltNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: RivoltNotificationService
      - path: Rivolt/Push/NotificationFetch.swift
      - path: Rivolt/Auth/TokenStore.swift
      - path: Rivolt/Net/ServerURL.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rivolt.app.notifications
        # iPhone only, as the app (see the Rivolt target).
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: RivoltNotificationService
        INFOPLIST_KEY_CFBundleDisplayName: Rivolt notifications
        # The extension point goes in through the Info.plist XcodeGen writes below.
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: RivoltNotificationService/RivoltNotificationService.entitlements
    info:
      path: RivoltNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Rivolt notifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  # Home-screen and lock-screen widgets (charge and range). Read-only: they fetch the
  # same two reads the app's Home does, with the token from the shared Keychain
  # group, and keep the last snapshot in the App Group. The views, the model and the
  # fetch are shared with the app (so CI can render and test them).
  RivoltWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RivoltWidgets
      - path: Rivolt/Widget
      # The Theme layer (web new look) and its fonts, so the widgets look like the app.
      - path: Rivolt/Theme/Theme.swift
      - path: Rivolt/Theme/ThemeTokens.swift
      - path: Rivolt/Views/ThemeGauge.swift
      - path: Rivolt/Resources/Fonts
        buildPhase: resources
      - path: Rivolt/Views/NowModel.swift
      - path: Rivolt/Views/NowInk.swift
      # The one rounding rule for every figure (the web's), in the widgets and the Live Activity too.
      - path: Rivolt/Views/NumberText.swift
      - path: Rivolt/LiveActivity/ChargingActivity.swift
      - path: Rivolt/LiveActivity/ChargingActivityViews.swift
      - path: Rivolt/Net/Models.swift
      - path: Rivolt/Net/JSON.swift
      - path: Rivolt/Net/ServerURL.swift
      - path: Rivolt/Auth/TokenStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rivolt.app.widgets
        PRODUCT_NAME: RivoltWidgets
        INFOPLIST_KEY_CFBundleDisplayName: Rivolt widgets
        SKIP_INSTALL: YES
        # XcodeGen's iOS preset sets "1,2" on every target and overrides the project value.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: RivoltWidgets/RivoltWidgets.entitlements
    info:
      path: RivoltWidgets/Info.plist
      properties:
        CFBundleDisplayName: Rivolt widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Unit tests, run by CI (.github/workflows/ios.yml) on a simulator. No
  # host-app UI is exercised; tests import the app module with @testable.
  RivoltTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RivoltTests
      # The design tokens, so the Theme can be checked against them (ThemeTokensTests).
      - path: design/tokens.json
        buildPhase: resources
    dependencies:
      - target: Rivolt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rivolt.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rivolt:
    build:
      targets:
        Rivolt: all
        RivoltNotificationService: all
        RivoltWidgets: all
        RivoltTests: [test]
    test:
      targets:
        - RivoltTests
