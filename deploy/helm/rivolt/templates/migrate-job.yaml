{{- if .Values.migrate.job.enabled }}
# Database migrations (design: migrations-job-design.md, DA-approved Oct 25).
# An Argo CD Sync hook at wave 0: after the CNPG Cluster (wave -1), before the
# Deployment (wave 1). A failed Job fails the sync, so the Deployment isn't
# updated and the old pods keep serving on the old schema (each migration is
# its own transaction).
#
# One Job per release and Job spec: the name is <fullname>-migrate-<version>-<hash
# of this Job's spec>. A second sync of the same revision (the ApplicationSet's
# progressive sync starts two, Oct 25) finds the Job by name and reuses it,
# finished, instead of running again or replacing the run that applied the
# migrations: Argo creates a named hook once. Any change to the image or to this
# spec gives a new name, so a changed Job is never patched in place (a Job's
# template is immutable). ttlSecondsAfterFinished removes Jobs a day after they
# finish. A failed Job stays failed until a new release, or until it's deleted
# (then a re-sync runs it again). Every Job carries rivolt.dev/version
# (ship-release.sh waits on it).
#
# Minimal env: the database connection (host, port, name and TLS mode as
# literals, the credentials through rivolt.dbCredentialsEnv) and the two grant
# roles when configured. No envFrom: the migrator needs none of the app's other
# settings or secrets. It logs migration ids and timings only.
{{- $spec := include "rivolt.migrateJobSpec" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rivolt.migrateJobName" (dict "root" . "spec" $spec) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rivolt.migrateLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
spec:
  {{- $spec | nindent 2 }}
{{- end }}
