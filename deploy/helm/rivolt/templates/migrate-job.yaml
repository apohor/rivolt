{{- if .Values.migrate.job.enabled }}
# Database migrations (design: migrations-job-design.md + its Oct 25 addendum, DA-approved).
# A plain resource at sync wave 0, not a hook: after the CNPG Cluster (wave -1),
# before the Deployment (wave 1). Argo waits on its health before wave 1:
# Progressing while it runs, Healthy when complete; Degraded (failed) fails the
# sync, so the Deployment isn't updated and the old pods keep serving on the old
# schema (each migration is its own transaction). A Degraded app also holds the
# platform ApplicationSet's RollingSync step, so later waves' apps don't sync
# until it's resolved.
#
# Not a hook, because Argo deletes and recreates a hook that has no delete
# policy (the default is BeforeHookCreation) on every sync and every retry: the
# migration re-ran 2-4 times per revision and up to 6 times after a failure.
# As a resource, an unchanged Job re-applies as a no-op.
#
# One Job per release and Job spec: the name is <fullname>-migrate-<version>-<hash
# of this Job's spec>, so it runs once per new image or spec, and a changed Job is
# never patched in place (a Job's template is immutable). The previous Job is no
# longer rendered; IgnoreExtraneous keeps it from making the app OutOfSync (our
# syncs don't prune), and ttlSecondsAfterFinished removes it 7 days after it
# finished. A failed Job stays failed, and retries fail fast on it, until it's
# deleted (then the next sync runs it again) or its TTL expires: after 7 days the
# next sync reruns a failed migration on its own. Every Job carries
# rivolt.dev/version (ship-release.sh waits on it).
#
# Minimal env: the database connection (host, port, name and TLS mode as
# literals, the credentials through rivolt.dbCredentialsEnv) and the two grant
# roles when configured. No envFrom: the migrator needs none of the app's other
# settings or secrets. It logs migration ids and timings only.
{{- $spec := include "rivolt.migrateJobSpec" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rivolt.migrateJobName" (dict "root" . "spec" $spec) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rivolt.migrateLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  {{- $spec | nindent 2 }}
{{- end }}
