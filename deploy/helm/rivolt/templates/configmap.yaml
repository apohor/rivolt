apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rivolt.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rivolt.labels" . | nindent 4 }}
data:
  ADDR: ":8080"
  DATA_DIR: "/data"
  DB_HOST: {{ include "rivolt.dbHost" . | quote }}
  DB_PORT: {{ include "rivolt.dbPort" . | quote }}
  DB_NAME: {{ include "rivolt.dbName" . | quote }}
  DB_SSLMODE: {{ include "rivolt.dbSslMode" . | quote }}
  TZ: {{ .Values.config.tz | quote }}
  {{- /* Replicas that may run at once (replicas + the rolling-update surge): the fallback limits
         that apply while Redis is down are a share of the shared ones, 1/this each. */}}
  {{- $surge := int (dig "rollingUpdate" "maxSurge" 1 (.Values.updateStrategy | default dict)) }}
  RIVOLT_REPLICA_DIVISOR: {{ .Values.config.replicaDivisor | default (add (int .Values.replicaCount) (max 1 $surge)) | quote }}
  RIVOLT_SECURE_COOKIE: {{ .Values.config.secureCookie | quote }}
  {{- if .Values.adminOnly }}
  {{- if .Values.ingress.enabled }}
  {{- fail "adminOnly is reached only through Cloudflare Access: set ingress.enabled=false" }}
  {{- end }}
  RIVOLT_ADMIN_ONLY: "true"
  {{- end }}
  {{- with .Values.config.baseUrl }}
  RIVOLT_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.oidc.providers }}
  RIVOLT_OIDC_PROVIDERS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.trustedProxyCIDR }}
  RIVOLT_TRUSTED_PROXY_CIDR: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.config.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
