{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rivolt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rivolt.labels" . | nindent 4 }}
  {{- if or .Values.migrate.job.enabled .Values.deploymentAnnotations }}
  annotations:
    {{- if .Values.migrate.job.enabled }}
    # After the migrate Job (sync wave 0): Argo applies this only once the
    # Job has completed, so a failed migration leaves the old pods serving.
    argocd.argoproj.io/sync-wave: "1"
    {{- end }}
    {{- with .Values.deploymentAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # Update strategy is configurable so deployments don't have to
  # eat a hard "no available server" window. Default in values.yaml
  # is RollingUpdate (maxSurge=1, maxUnavailable=0) so a new pod
  # comes up healthy before the old one is removed. Operators who
  # turn `persistence.enabled` on with a ReadWriteOnce PVC must
  # flip this to Recreate via values to avoid two pods racing for
  # the volume — see values.yaml for the trade-off note.
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "rivolt.selectorLabels" . | nindent 6 }}
  template:{{ include "rivolt.podTemplate" . }}
{{- end }}
