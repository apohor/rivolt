# CI render: a Rollout in place of the Deployment, with a PodMonitor and the Deployment annotation used for a gap-free switch.
secrets:
  kek: "v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
externalDatabase:
  host: postgres.example.invalid
rollout:
  enabled: true
  strategy:
    canary:
      stableService: rivolt-stable
      canaryService: rivolt-canary
      trafficRouting:
        traefik:
          weightedTraefikServiceName: rivolt-weighted
      steps:
        - pause: {}
        - setWeight: 25
        - pause: {duration: 120s}
deploymentAnnotations:
  argocd.argoproj.io/sync-options: PruneLast=true
metrics:
  podMonitor:
    enabled: true
