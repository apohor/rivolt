# CI render: CloudNativePG with the Barman Cloud plugin (ObjectStore + plugins block + ScheduledBackup method plugin).
secrets:
  kek: "v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
cnpg:
  enabled: true
  backup:
    enabled: true
    method: plugin
    objectStore:
      name: rivolt-pg-r2
      serverName: rivolt-pg-r2
      retentionPolicy: "364d"
      configuration:
        destinationPath: s3://example-bucket/prod/
        endpointURL: https://example.r2.cloudflarestorage.com
        s3Credentials:
          accessKeyId: {name: example-creds, key: ACCESS_KEY_ID}
          secretAccessKey: {name: example-creds, key: ACCESS_SECRET_KEY}
          region: {name: example-creds, key: REGION}
        wal: {compression: gzip}
        data: {compression: gzip}
