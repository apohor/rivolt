<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Blocking same-origin script (CSP allows 'self', not inline): sets
         the cached light theme before first paint. See theme-init.js. -->
    <script src="/theme-init.js?v=3"></script>
    <!-- Before the app's module entry: reloads (at most twice) if an
         /assets/ file fails to load across a deploy. See asset-guard.js. -->
    <script src="/asset-guard.js?v=1"></script>
    <meta
      name="description"
      content="Free, open-source tracker for Rivian owners: charging cost, trips, efficiency and lease miles. Unofficial, not affiliated with Rivian."
    />

    <!-- Link previews (Reddit, Discord, iMessage, Slack). Static, same-origin
         image; no third-party requests. Per-route values and canonical
         come from the server for the public pages. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rivolt" />
    <meta property="og:title" content="Rivolt: what your Rivian actually costs" />
    <meta property="og:description" content="Free, open-source tracker for Rivian owners: charging cost, trips, efficiency and lease miles. Unofficial, not affiliated with Rivian." />
    <meta property="og:image" content="https://rivolt.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rivolt: what your Rivian actually costs, with the Now tab on a sample truck" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rivolt: what your Rivian actually costs" />
    <meta name="twitter:description" content="Free, open-source tracker for Rivian owners: charging cost, trips, efficiency and lease miles. Unofficial, not affiliated with Rivian." />
    <meta name="twitter:image" content="https://rivolt.dev/og.png" />

    <!-- PWA manifest + icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="application/atom+xml" title="Rivolt release notes" href="/changelog.atom" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- iOS home-screen integration. Safari ignores the manifest's
         display/theme/icon fields on older iPadOS builds, so we repeat
         them as apple-* meta tags. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rivolt" />

    <title>Rivolt: Rivian charging cost, trip and efficiency tracker</title>
  </head>
  <body class="bg-neutral-950 text-neutral-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
