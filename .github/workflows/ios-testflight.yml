name: ios-testflight

# Signs the iPhone app and uploads it to TestFlight (internal testers only).
# Runs on an ios-v* tag or by hand, inside the `testflight` environment: the
# owner approves every run, and only that environment holds the App Store
# Connect API key. Nothing secret is in the repo: no certificate, profile or
# Team ID. Signing is Xcode's automatic cloud signing with the API key
# (-allowProvisioningUpdates); the bundle ID comes from project.yml.
#
# Tag ios-vX.Y.Z sets the app version X.Y.Z; the build number is this
# workflow's run number, so every upload is newer than the last. A manual run
# with dry_run=true archives, signs and exports an .ipa without uploading:
# use it once to prove signing before the first real upload.

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sign and export only, no upload"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  XCODE_APP: /Applications/Xcode_26.3.app
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Version and build number
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            version="${GITHUB_REF#refs/tags/ios-v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "tag must be ios-vX.Y or ios-vX.Y.Z, got $GITHUB_REF"; exit 1
            fi
            upload=true
          else
            version=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)".*/\1/p' ios/project.yml | head -n1)
            upload=$([ "${{ inputs.dry_run }}" = "false" ] && echo true || echo false)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "Rivolt $version (${{ github.run_number }}), upload=$upload" >> "$GITHUB_STEP_SUMMARY"

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      # Automatic signing archives with a development profile (the export then
      # re-signs for the App Store), and Apple issues one only when the team
      # has at least one registered device: keep one registered in the
      # developer portal. Xcode refuses "Apple Distribution" with Automatic.
      - name: Archive (Release, cloud signing)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/Rivolt.xcodeproj \
            -scheme Rivolt \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Rivolt.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            -quiet

      # A dry run never reaches App Store validation, so check here what
      # rejected ios-v0.1.0: icon name, iPhone-only family, a compiled icon.
      - name: Check the archived app for App Store basics
        run: ios/check-app-store-basics.sh "$RUNNER_TEMP/Rivolt.xcarchive/Products/Applications/Rivolt.app"

      - name: Export and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # destination=upload sends the build straight to App Store Connect
          # (TestFlight); export only writes the .ipa (the dry run).
          dest=$([ "${{ steps.ver.outputs.upload }}" = "true" ] && echo upload || echo export)
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${dest}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Rivolt.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -l "$RUNNER_TEMP/export" || true
          if [ "$dest" = upload ]; then
            echo "Uploaded to App Store Connect: it appears in TestFlight after processing (usually 5-30 min)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run: signed and exported, not uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
