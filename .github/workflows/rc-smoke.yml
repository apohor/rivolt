# The release-candidate smoke. Pushing an rc tag vX.Y.Z-rc.N waits until https://preview.rivolt.dev/api/health reports that version (the tag
# build's pin-preview rolls it), runs web/e2e/rc-smoke-live.pw.ts against preview, and posts the commit status `qa/rc-gate` on the rc's commit,
# which release.yml's verdict (.github/ci/release-verdict.sh) and the final's tag-validate (final-gate.sh) require to be success.
#
# What it covers: the signed-out demo (Now, Activity, Money, the planner and a preset) on a 393 px phone, light and dark: it loads, no console
# errors, no failed API call. It never signs in: CI holds no preview account. What it does not cover: the signed-in pages, and iOS. The iOS UI tests
# (ios.yml, ui-tests) answer every call from fixtures, so they test the commit's code, not preview, and already run on the PR and on main.
#
# A human can still post the gate by hand (ops/release/set-qa-gate.sh in rivolt-infra). This workflow does not overwrite a success that is not
# its own: a status the run did not write (a description not starting "rc smoke") that is already success stays.
#
# workflow_dispatch (and a PR touching this file) tries it without a tag: it smokes whatever version preview reports, at the dispatched ref's commit, and posts its result on
# `context` (default qa/rc-smoke-dry-run), never on qa/rc-gate unless typed.
name: rc smoke

on:
  push:
    tags: ["v*-rc.*"]
  # A change to this workflow or the live spec smokes preview too, on the dry-run context (a PR cannot dispatch a workflow that is not on main yet).
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rc-smoke.yml"
      - "web/e2e/rc-smoke-live.pw.ts"
  workflow_dispatch:
    inputs:
      context:
        description: "Status context to post (the real gate is qa/rc-gate; leave the default to try the smoke)"
        default: qa/rc-smoke-dry-run
        required: true

permissions:
  contents: read
  statuses: write

concurrency:
  group: rc-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  PREVIEW: https://preview.rivolt.dev
  # The real gate only for a pushed rc tag; any other trigger posts on the dry-run context unless a dispatch names one.
  CONTEXT: ${{ inputs.context || (github.ref_type == 'tag' && 'qa/rc-gate' || 'qa/rc-smoke-dry-run') }}
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  smoke:
    name: smoke preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Which version preview must report
        id: want
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            [[ $REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || { echo "::error::$REF_NAME is not vX.Y.Z-rc.N"; exit 1; }
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            curl -sS --max-time 20 -D - "$PREVIEW/api/health" | head -c 600 || true
            v=$(curl -fsS --max-time 20 "$PREVIEW/api/health" | jq -r .version)
            [ -n "$v" ] && [ "$v" != null ] || { echo "::error::preview reported no version"; exit 1; }
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi

      # A pending status while it runs, so the commit shows the gate is being worked. Not over a success that a person posted.
      - name: Post pending
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cur=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq "[.statuses[] | select(.context == \"$CONTEXT\")][0] | (.state // \"none\") + \"|\" + (.description // \"\")")
          if [ "${cur%%|*}" = success ] && [[ ${cur#*|} != "rc smoke"* ]]; then echo "a person's success is on $CONTEXT; not touching it"; exit 0; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="$CONTEXT" \
            -f description="rc smoke: waiting for preview to run ${{ steps.want.outputs.version }}" -f target_url="$RUN" > /dev/null

      # The tag build pins preview, Argo rolls it, and the canary takes a few minutes: poll for up to 40 minutes. Three reads in a row, so a
      # half-rolled preview that still answers from an old pod does not pass.
      - name: Wait for preview to run the version
        env:
          WANT: ${{ steps.want.outputs.version }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2400)); seen=0; got=none
          while [ $SECONDS -lt $deadline ]; do
            got=$(curl -fsS --max-time 15 "$PREVIEW/api/health" 2>/dev/null | jq -r '.version // "none"' 2>/dev/null || echo unreachable)
            if [ "$got" = "$WANT" ]; then seen=$((seen + 1)); else seen=0; fi
            [ $seen -ge 3 ] && { echo "preview runs $WANT"; exit 0; }
            sleep 20
          done
          echo "::error::preview still reports '$got', not $WANT, after 40 minutes"
          exit 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke preview
        working-directory: web
        env:
          E2E_LIVE_URL: ${{ env.PREVIEW }}
          CI: "true"
        run: npx playwright test e2e/rc-smoke-live.pw.ts --project=chromium

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rc-smoke-report
          path: |
            web/playwright-report
            web/e2e/__results__
          retention-days: 14
          if-no-files-found: ignore

      # Last, whatever happened: the verdict lands on the commit. A cancelled run posts nothing (the pending stays; a rerun replaces it).
      - name: Post the gate
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ job.status }}
          WANT: ${{ steps.want.outputs.version }}
        run: |
          set -euo pipefail
          cur=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq "[.statuses[] | select(.context == \"$CONTEXT\")][0] | (.state // \"none\") + \"|\" + (.description // \"\")")
          if [ "${cur%%|*}" = success ] && [[ ${cur#*|} != "rc smoke"* ]]; then echo "a person's success is on $CONTEXT; not touching it"; exit 0; fi
          if [ "$RESULT" = success ]; then state=success; desc="rc smoke passed on preview $WANT"
          else state=failure; desc="rc smoke failed on preview $WANT (see the run)"; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$CONTEXT" -f description="$desc" -f target_url="$RUN" > /dev/null
          echo "$CONTEXT = $state on ${SHA:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"
