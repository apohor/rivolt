name: ios

# Native iOS client (ios/): generate the Xcode project with XcodeGen, build
# and run the unit tests on an iOS Simulator. Ad-hoc ("Sign to Run Locally")
# signing only, with no team, certificate or secret: an unsigned simulator app
# has no entitlements, and the Keychain then refuses it (errSecMissingEntitlement,
# -34018), which the token-store tests hit. No TestFlight here (that is a
# separate, reviewer-gated job once the Apple account exists). Nobody
# builds the app locally (no heavy local builds), so this is the only place
# the iOS code compiles: keep it green.
#
# Pins: the runner image's Xcode 26.3 (iOS 26.2 simulator SDK; App Store
# uploads need the current SDK) and XcodeGen 2.46.0 checked against its
# release sha256. Public repo: standard macOS runners cost nothing.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_APP: /Applications/Xcode_26.3.app
  SIM_RUNTIME: iOS 26.2
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  # The Python tooling under ios/ (stdlib only): the certificate revoke and
  # cleanup selection, whose mistakes would revoke the wrong certificate.
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Certificate revoke selection tests
        run: python3 -I ios/test_revoke_runner_dev_certs.py -v
      - name: App Store listing text (limits, no credentials in the review notes)
        run: |
          python3 -I ios/store/test_check_listing.py -v
          python3 -I ios/store/check_listing.py ios/store/listing.md

  # The required check. Kept short so a PR hears back fast: build, unit tests
  # and the Now card renders (uploaded as soon as the tests finish). The slow
  # simulator screenshots and the Release device build run beside it.
  build-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          xcodegen --version
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          # First available iPhone on the pinned runtime; the device names
          # change with every Xcode, the runtime is what we pin.
          udid=$(xcrun simctl list devices available -j | jq -r --arg rt "$SIM_RUNTIME" '
            .devices | to_entries[]
            | select(.key | test("SimRuntime\\.iOS-" + ($rt | sub("^iOS "; "") | gsub("\\."; "-")) + "$"))
            | .value[] | select(.name | startswith("iPhone")) | .udid' | head -n1)
          if [ -z "$udid" ]; then
            echo "no iPhone simulator for $SIM_RUNTIME"; xcrun simctl list runtimes; exit 1
          fi
          xcrun simctl list devices | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          # Seen by the tests as SNAPSHOT_DIR: the Now card renders land here.
          TEST_RUNNER_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/Rivolt.xcodeproj \
            -scheme Rivolt \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/ios.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            -quiet

      - name: Test summary (fail if no tests ran)
        if: always() && steps.sim.outcome == 'success'
        run: |
          set -euo pipefail
          # -quiet hides the per-test lines; the result bundle has the counts.
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/ios.xcresult" --compact > "$RUNNER_TEMP/summary.json"
          jq '{result, totalTestCount, passedTests, failedTests, skippedTests}' "$RUNNER_TEMP/summary.json"
          # Failures and what they said, so a red run is readable without
          # downloading the result bundle (nobody has Xcode locally).
          jq -r '.testFailures[]? | "FAILED \(.testIdentifierString // .testName): \(.failureText)"' "$RUNNER_TEMP/summary.json"
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ios.xcresult" --compact \
            | jq -r '.. | objects | select(.result? == "Failed" and .nodeType? == "Test Case") | "case: \(.name)"' || true
          total=$(jq -r '.totalTestCount' "$RUNNER_TEMP/summary.json")
          if [ "${total:-0}" -lt 1 ]; then
            echo "no tests ran"; exit 1
          fi
          {
            echo "### iOS unit tests"
            jq -r '"\(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped (\(.totalTestCount) total)"' "$RUNNER_TEMP/summary.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the UI snapshots
        if: always() && steps.sim.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/ios.xcresult
          retention-days: 7

  screenshots:
    # Slow and rarely changed by a PR: manual runs (the lead dispatches one on
    # each ios-v* tag before TestFlight) and PRs labelled ios-screens only.
    # Not on every main push: with several iOS merges an hour, three macOS jobs
    # per push queued main's build-test 10+ minutes behind.
    # Rule (DA): a PR touching ios/project.yml, any *.entitlements, the
    # AppIcon asset or ios/check-app-store-basics.sh gets the ios-screens
    # label before merge, so the App Store basics check runs on it.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ios-screens'))
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          xcodegen --version
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          # First available iPhone on the pinned runtime; the device names
          # change with every Xcode, the runtime is what we pin.
          udid=$(xcrun simctl list devices available -j | jq -r --arg rt "$SIM_RUNTIME" '
            .devices | to_entries[]
            | select(.key | test("SimRuntime\\.iOS-" + ($rt | sub("^iOS "; "") | gsub("\\."; "-")) + "$"))
            | .value[] | select(.name | startswith("iPhone")) | .udid' | head -n1)
          if [ -z "$udid" ]; then
            echo "no iPhone simulator for $SIM_RUNTIME"; xcrun simctl list runtimes; exit 1
          fi
          xcrun simctl list devices | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build for the simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios/Rivolt.xcodeproj \
            -scheme Rivolt \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            -quiet

      # Fixed screens (launch argument -rivolt-preview <name>: no network, no
      # Keychain, no iOS prompts) in light and dark, for review: nobody has Xcode
      # locally, so this is how the native UI is looked at.
      - name: Screenshots (light and dark)
        timeout-minutes: 20
        run: |
          set -uo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Rivolt.app"
          test -d "$app"
          # Every simulator call is bounded, and the bounds are generous: right after the
          # tests the simulator is slow (a first run needed ~6 minutes for its first
          # terminate and launch), and killing a simctl call midway made it worse. The
          # bound is there so a truly hung call fails this step with a message.
          bounded() {
            local secs=$1; shift
            "$@" &
            local pid=$! i=0
            while kill -0 "$pid" 2>/dev/null; do
              i=$((i + 1))
              if [ "$i" -gt "$secs" ]; then
                echo "TIMEOUT after ${secs}s: $*" >&2
                kill -9 "$pid" 2>/dev/null || true
                return 124
              fi
              sleep 1
            done
            wait "$pid"
          }
          failed=0
          # The bundle id comes from the build (the owner may still change it, N28).
          bid=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          echo "bundle id: $bid"
          bounded 120 xcrun simctl boot "$udid" || true
          bounded 300 xcrun simctl bootstatus "$udid" -b || { echo "simulator did not finish booting"; exit 1; }
          bounded 600 xcrun simctl install "$udid" "$app" || { echo "install failed"; exit 1; }
          mkdir -p "$RUNNER_TEMP/shots"
          for mode in light dark; do
            bounded 300 xcrun simctl ui "$udid" appearance "$mode" || true
            for screen in prompt notifications notifications-denied notifications-test signin signin-unavailable acknowledgements; do
              if ! bounded 420 xcrun simctl launch --terminate-running-process "$udid" "$bid" -rivolt-preview "$screen"; then
                echo "launch failed for $screen ($mode)"; failed=1
                # What the app said, so a crash in preview mode is readable.
                bounded 120 xcrun simctl spawn "$udid" log show --last 1m --style compact --predicate 'process == "Rivolt"' | tail -40 || true
                continue
              fi
              # Give the first frame time, then shoot; a blank or tiny file is retried.
              sleep 6
              out="$RUNNER_TEMP/shots/$screen-$mode.png"
              for try in 1 2 3; do
                bounded 180 xcrun simctl io "$udid" screenshot "$out" || true
                [ -f "$out" ] && [ "$(stat -f%z "$out")" -gt 20000 ] && break
                sleep 3
              done
              [ -f "$out" ] || failed=1
            done
          done
          ls -l "$RUNNER_TEMP/shots" || true
          exit "$failed"

      - name: Upload the screenshots
        if: always() && steps.sim.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 14


  appstore:
    # Slow and rarely changed by a PR: manual runs (the lead dispatches one on
    # each ios-v* tag before TestFlight) and PRs labelled ios-screens only.
    # Not on every main push: with several iOS merges an hour, three macOS jobs
    # per push queued main's build-test 10+ minutes behind.
    # Rule (DA): a PR touching ios/project.yml, any *.entitlements, the
    # AppIcon asset or ios/check-app-store-basics.sh gets the ios-screens
    # label before merge, so the App Store basics check runs on it.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ios-screens'))
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          xcodegen --version
          xcodegen generate

      # The signed archive takes its entitlements from CODE_SIGN_ENTITLEMENTS in Release; a project.yml mistake that
      # drops it (ios-v0.2.4: `configs:` nested under `info:`) builds fine unsigned and only fails at upload.
      - name: Release entitlements are set for the app and both extensions
        run: |
          set -euo pipefail
          for pair in Rivolt=Rivolt/Rivolt.entitlements \
                      RivoltNotificationService=RivoltNotificationService/RivoltNotificationService.entitlements \
                      RivoltWidgets=RivoltWidgets/RivoltWidgets.entitlements; do
            target="${pair%%=*}" want="${pair#*=}"
            got=$(xcodebuild -showBuildSettings -project ios/Rivolt.xcodeproj -target "$target" -configuration Release 2>/dev/null \
              | awk -F' = ' '$1 ~ /^ *CODE_SIGN_ENTITLEMENTS$/ {print $2}' || true)
            if [ "$got" != "$want" ]; then
              echo "::error::$target Release CODE_SIGN_ENTITLEMENTS is '$got', want '$want'"
              exit 1
            fi
            test -f "ios/$want" || { echo "::error::ios/$want is missing"; exit 1; }
            echo "$target: $got"
          done

      # The App Store rejects what a simulator test build never shows (app icon,
      # iPhone-only family): build Release for a device, unsigned, and run the
      # same check ios-testflight.yml runs on the signed archive before upload.
      - name: App Store basics (Release device build, unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios/Rivolt.xcodeproj \
            -scheme Rivolt \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/release" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/release.log" 2>&1 \
            || { tail -60 "$RUNNER_TEMP/release.log"; exit 1; }
          # The asset catalog step, so a missing icon is traceable to actool.
          grep -A3 -E '^CompileAssetCatalog' "$RUNNER_TEMP/release.log" | cut -c1-400 || echo "no CompileAssetCatalog step ran"
          ios/check-app-store-basics.sh \
            "$RUNNER_TEMP/release/Build/Products/Release-iphoneos/Rivolt.app" "$RUNNER_TEMP/release"
          # The app's size as built (device, Release, unsigned) and zipped (close to the download), and what the map
          # renderer takes of it, so a size change shows up in the log.
          app="$RUNNER_TEMP/release/Build/Products/Release-iphoneos/Rivolt.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/app.zip"
          echo "App size: $(du -sk "$app" | cut -f1) KB on disk, $(du -k "$RUNNER_TEMP/app.zip" | cut -f1) KB zipped;" \
            "MapLibre.framework $(du -sk "$app/Frameworks/MapLibre.framework" 2>/dev/null | cut -f1 || echo 0) KB;" \
            "map resources $(du -sk "$app/Map" 2>/dev/null | cut -f1 || echo 0) KB"
