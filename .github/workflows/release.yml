# Release as a Git event, step 2 and 7a of the release-gitops design: the dispatch that cuts a release candidate tag. It runs the checks
# ship-rc.sh / ship-release.sh make before a tag (.github/ci/release-verdict.sh) and, with dry_run off and a clean verdict, creates the annotated
# rc tag at the verdict's SHA with the rivolt-infra GitHub App's token (a GITHUB_TOKEN tag push does not start the tag build; the App's installation
# on apohor/rivolt is N66). Pushing the tag starts build.yml's tag run exactly as a hand-pushed tag does: tag-validate, retag, pin-preview.
# dry_run (the default) tags nothing: it prints the verdict and proves the token can write to this repo by creating and deleting a probe branch.
# A FINAL tag is cut with final=true (rc empty) at the gated rc's commit: prod is an autosync app, so the tag run's bump-prod pin commit is the
# deploy, then unpin-preview. Without final=true a final is refused. A final with no gated rc needs no_rc_reason AND the release-bypass
# environment's approval; the bypass job commits the rc-bypass.log line to rivolt-infra first and fails the run if that push fails, so the
# tag job (which needs it) never runs without the logged line.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, vX.Y.Z"
        required: true
        type: string
      rc:
        description: "Cut release candidate vX.Y.Z-rc.N: the number N. Empty = the final tag"
        required: false
        type: string
      gated_rc:
        description: "Final tag: the number of the rc qa gated (the final is cut at that rc's commit)"
        required: false
        type: string
      final:
        description: "Cut the final tag vX.Y.Z (rc empty) at the gated rc's commit. Untick = a final is refused"
        required: false
        type: boolean
        default: false
      no_rc_reason:
        description: "Final tag without a gated rc: the real reason (logged; emergency only)"
        required: false
        type: string
      sha:
        description: "Commit to tag. Empty = main's head"
        required: false
        type: string
      dry_run:
        description: "Verdict and token probe only: tag nothing. Untick to cut the rc tag"
        required: false
        type: boolean
        default: true

# One release at a time, queued not cancelled (pin/unpin jobs join this group later).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  statuses: read

jobs:
  verdict:
    name: verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.verdict.outputs.tag }}
      sha: ${{ steps.verdict.outputs.sha }}
      refused: ${{ steps.verdict.outputs.refused }}
    steps:
      # Tags and probe refs are cut only from a run on main: a dispatch on another branch would run that branch's copy of this file.
      - name: Main only
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::release.yml cuts tags only from main; this run is on ${{ github.ref }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Token for rivolt-infra (GitHub App, read)
        id: infra-token
        if: vars.RIVOLT_INFRA_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RIVOLT_INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.RIVOLT_INFRA_APP_KEY }}
          owner: apohor
          repositories: rivolt-infra
          permission-contents: read
      - name: Checkout rivolt-infra (release helpers and the preview values)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: apohor/rivolt-infra
          token: ${{ steps.infra-token.outputs.token }}
          persist-credentials: false
          path: infra
          sparse-checkout: |
            ops/release/releasectl.py
            apps/platform/rivolt-preview/values.yaml
            apps/platform/rivolt-admin-preview/values.yaml
      - name: Verdict
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          RC: ${{ inputs.rc }}
          GATED_RC: ${{ inputs.gated_rc }}
          NO_RC_REASON: ${{ inputs.no_rc_reason }}
          FINAL_BY_WORKFLOW: ${{ inputs.final }}
          SHA: ${{ inputs.sha }}
          INFRA_DIR: ${{ github.workspace }}/infra
        run: bash .github/ci/release-verdict.sh
      # A real run that the verdict refuses fails here, so the run is red and no tag job starts.
      - name: Refuse
        if: ${{ !inputs.dry_run && steps.verdict.outputs.refused != 'false' }}
        run: |
          echo "::error::the release verdict refused ${{ steps.verdict.outputs.tag }}: see the step summary"
          exit 1

  # dry_run: prove the App token can write to this repository without touching a tag (v* tags are immutable): create a probe branch ref at the
  # head of main, then delete it. A failure here is the N66 installation or permission not being in place.
  probe:
    name: token probe (dry run)
    if: ${{ inputs.dry_run && github.ref == 'refs/heads/main' }}
    needs: verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Token for rivolt (GitHub App, write)
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RIVOLT_INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.RIVOLT_INFRA_APP_KEY }}
          owner: apohor
          repositories: rivolt
          permission-contents: write
      - name: Create and delete a probe ref
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          ref="refs/heads/release-probe/$RUN_ID"
          gh api -X POST "repos/$GH_REPO/git/refs" -f ref="$ref" -f sha="$head" --jq .ref
          gh api -X DELETE "repos/$GH_REPO/git/$ref"
          echo "the App token created and deleted $ref at ${head:0:7}: it can write to $GH_REPO" | tee -a "$GITHUB_STEP_SUMMARY"

  # A final with no gated rc: the environment's required reviewer approves (in place of the typed yes), then the log line goes to rivolt-infra
  # main BEFORE the tag. A failed push fails this job and the tag job never starts.
  bypass:
    name: bypass log
    if: ${{ !inputs.dry_run && inputs.final && inputs.no_rc_reason != '' && inputs.gated_rc == '' && inputs.rc == '' && github.ref == 'refs/heads/main' && needs.verdict.outputs.refused == 'false' }}
    needs: verdict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-bypass
    steps:
      - name: Token for rivolt-infra (GitHub App, write)
        id: infra-write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RIVOLT_INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.RIVOLT_INFRA_APP_KEY }}
          owner: apohor
          repositories: rivolt-infra
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/ci
      - name: Checkout rivolt-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: apohor/rivolt-infra
          token: ${{ steps.infra-write.outputs.token }}
          path: infra
      - name: Log the bypass on rivolt-infra main
        env:
          TAG: ${{ needs.verdict.outputs.tag }}
          SHA: ${{ needs.verdict.outputs.sha }}
          REASON: ${{ inputs.no_rc_reason }}
        run: bash .github/ci/bypass-log.sh infra

  tag:
    name: tag
    # The bypass job is skipped unless this is a no-rc final; when it runs it must have succeeded (the log line is on main).
    if: ${{ !cancelled() && !inputs.dry_run && github.ref == 'refs/heads/main' && needs.verdict.result == 'success' && (needs.bypass.result == 'success' || needs.bypass.result == 'skipped') }}
    needs: [verdict, bypass]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Token for rivolt (GitHub App, write)
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RIVOLT_INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.RIVOLT_INFRA_APP_KEY }}
          owner: apohor
          repositories: rivolt
          permission-contents: write
      - name: Create the annotated tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verdict.outputs.tag }}
          SHA: ${{ needs.verdict.outputs.sha }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*-rc.*) ;;
            v*-*) echo "::error::not a release tag: '$TAG'"; exit 1 ;;
            v*) [ "${{ inputs.final }}" = true ] || { echo "::error::a final tag needs final=true, got '$TAG'"; exit 1; } ;;
            *) echo "::error::not a release tag: '$TAG'"; exit 1 ;;
          esac
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no commit from the verdict"; exit 1; }
          obj=$(gh api -X POST "repos/$GH_REPO/git/tags" -f tag="$TAG" -f message="$TAG" -f object="$SHA" -f type=commit --jq .sha)
          gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$obj" --jq .ref
          # The tag must resolve to the verdict's commit (a refused create above already failed the step).
          got=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          [ "$got" = "$SHA" ] || { echo "::error::$TAG resolves to $got, not $SHA"; exit 1; }
          echo "tagged $TAG at ${SHA:0:7}; the tag build starts by itself (tag-validate, retag, then pin-preview for an rc or bump-prod and unpin-preview for a final)" | tee -a "$GITHUB_STEP_SUMMARY"
