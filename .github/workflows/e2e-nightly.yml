# Nightly Playwright on main.
#
# PRs run e2e (build.yml), main pushes don't, so a spec that breaks on its own
# (a date that crosses midnight or a month boundary, a merge that only fails
# combined) stays hidden until an unrelated PR trips on it. This runs the full
# e2e matrix on main at 00:15 UTC, just after the day (and, on the 1st, the
# month) turns over in the zone CI's browsers use, which is when date-bound
# specs break.
#
# Weekly (Mondays 00:45 UTC) the whole chromium suite also runs with the clock
# pinned (STUB_NOW, web/e2e/clock.ts) at fixed boundary instants: a month's last
# minutes, the 1st, a Monday and New Year. A spec that depends on the date it
# runs fails there, in a week, instead of one night a month.
#
# A failure opens, or comments on, one open issue titled "e2e red on main"
# (label: ci), the same one a WebKit failure on a main push uses (build.yml). A
# green run after a red one says so on that issue, naming which run (daily or
# boundary) it was; the lead closes it.
name: e2e nightly

on:
  schedule:
    - cron: "15 0 * * *"
    - cron: "45 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  # The same matrix and steps as build.yml's e2e job (keep them in step).
  e2e:
    name: e2e (${{ matrix.suite }} ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }})
    if: github.event.schedule != '45 0 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # One suite, every spec with the new look (as in build.yml).
          - { suite: all, project: chromium, shard: 1, total: 3 }
          - { suite: all, project: chromium, shard: 2, total: 3 }
          - { suite: all, project: chromium, shard: 3, total: 3 }
          - { suite: all, project: webkit, shard: 1, total: 1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund

      # Restores main's browser cache (saved by build.yml's playwright-cache job).
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: web
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install ${{ matrix.project }}
          fi
          ./scripts/pw-system-deps.sh ${{ matrix.project }}

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Restore spec timings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/e2e-timings
          key: e2e-timings-${{ matrix.project }}-none
          restore-keys: e2e-timings-${{ matrix.project }}-

      # The same duration-balanced split as build.yml (scripts/e2e-shard.mjs).
      - name: Playwright (${{ matrix.suite }}, ${{ matrix.project }})
        working-directory: web
        env:
          CI: "true"
          E2E_WEBKIT: "1"
          E2E_PROJECT: ${{ matrix.project }}
          E2E_TIMINGS: e2e-timings/${{ matrix.project }}.json
        run: |
          node scripts/e2e-shard.mjs --check ${{ matrix.total }}
          npx playwright test $(node scripts/e2e-shard.mjs ${{ matrix.shard }} ${{ matrix.total }}) --project=${{ matrix.project }} ${{ matrix.project == 'webkit' && '--pass-with-no-tests' || '' }}

      - name: Summary (flaky tests)
        if: always()
        working-directory: web
        run: node scripts/e2e-timings.mjs summary e2e-results/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-results-${{ matrix.project }}-${{ matrix.shard }}
          path: web/e2e-results/results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-nightly-${{ matrix.suite }}-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/e2e/__screenshots__
            web/e2e/__results__
          if-no-files-found: ignore
          retention-days: 7

  # The suite at fixed instants (STUB_NOW pins every fixture and the browser
  # clock). The instants are fixed strings here, never inputs.
  e2e-boundaries:
    name: e2e at ${{ matrix.at.label }} (${{ matrix.shard }}/3)
    if: github.event.schedule == '45 0 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        at:
          - { label: month-end, now: "2026-10-31T23:55:00Z" }
          - { label: month-start, now: "2026-11-01T00:05:00Z" }
          - { label: monday, now: "2026-11-02T00:05:00Z" }
          - { label: new-year, now: "2027-01-01T00:05:00Z" }
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: web
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium
          fi
          ./scripts/pw-system-deps.sh chromium

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Playwright at ${{ matrix.at.now }}
        working-directory: web
        env:
          CI: "true"
          STUB_NOW: ${{ matrix.at.now }}
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/3

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-boundary-${{ matrix.at.label }}-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/e2e/__screenshots__
            web/e2e/__results__
          if-no-files-found: ignore
          retention-days: 7

  # One issue, never a pile (.github/scripts/e2e-red-issue.sh, shared with the
  # WebKit run on main pushes in build.yml).
  report:
    needs: [e2e, e2e-boundaries]
    if: always() && needs.e2e.result != 'cancelled' && needs.e2e-boundaries.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checks out .github/scripts
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DAILY: ${{ needs.e2e.result }}
      BOUNDARIES: ${{ needs.e2e-boundaries.result }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: e2e red on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/scripts
            web/scripts
            web/e2e

      - name: Open, update or clear the issue
        env:
          ARTIFACTS: e2e-nightly-*, e2e-boundary-*
        run: |
          # Red if either half failed; a half that didn't run this time is skipped.
          RESULT=success
          for r in "$DAILY" "$BOUNDARIES"; do [ "$r" = "success" ] || [ "$r" = "skipped" ] || RESULT=failure; done
          # Name the run, so a green daily run doesn't read as clearing a boundary failure.
          KIND=""
          [ "$DAILY" != "skipped" ] && KIND="daily"
          [ "$BOUNDARIES" != "skipped" ] && KIND="${KIND:+$KIND + }pinned-clock boundary"
          RESULT="$RESULT" KIND="$KIND" bash .github/scripts/e2e-red-issue.sh

      # The daily run's per-spec timings (chromium for PRs, WebKit with main's pushes) and its flakes. The
      # pinned-clock boundary runs are left out: their timings are of one instant, and their flakes are
      # date bugs, which the red/green result above already reports.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.e2e.result != 'skipped'
        with:
          pattern: e2e-results-*
          path: results

      - name: Flaky tests and timings
        id: merge
        if: needs.e2e.result != 'skipped'
        env:
          ARTIFACTS: e2e-nightly-*
        run: |
          all=$(ls results/*/results.json 2>/dev/null || true)
          flaky=$(node web/scripts/e2e-timings.mjs flaky $all)
          RESULT=flaky TITLE="e2e flaky on main" KIND="daily" FLAKY="$flaky" bash .github/scripts/e2e-red-issue.sh
          mkdir -p timings/chromium timings/webkit
          node web/scripts/e2e-timings.mjs merge timings/chromium/chromium.json 3 $(ls results/e2e-results-chromium-*/results.json 2>/dev/null)
          node web/scripts/e2e-timings.mjs merge timings/webkit/webkit.json 1 $(ls results/e2e-results-webkit-*/results.json 2>/dev/null)
          [ -f timings/chromium/chromium.json ] && echo "chromium=true" >> "$GITHUB_OUTPUT" || true
          [ -f timings/webkit/webkit.json ] && echo "webkit=true" >> "$GITHUB_OUTPUT" || true
          # The cache paths are what the e2e jobs restore (web/e2e-timings/<browser>.json).
          mkdir -p web/e2e-timings

      - name: Save the chromium timings
        if: steps.merge.outputs.chromium == 'true'
        run: rm -rf web/e2e-timings && mkdir -p web/e2e-timings && cp timings/chromium/chromium.json web/e2e-timings/

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.merge.outputs.chromium == 'true'
        with:
          path: web/e2e-timings
          key: e2e-timings-chromium-${{ github.run_id }}

      - name: Save the WebKit timings
        if: steps.merge.outputs.webkit == 'true'
        run: rm -rf web/e2e-timings && mkdir -p web/e2e-timings && cp timings/webkit/webkit.json web/e2e-timings/

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.merge.outputs.webkit == 'true'
        with:
          path: web/e2e-timings
          key: e2e-timings-webkit-${{ github.run_id }}
