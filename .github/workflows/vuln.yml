# Scheduled Go vulnerability scan. Separate from build.yml so a newly
# published CVE surfaces on the weekly tick without waiting for the
# next code push - and a finding doesn't block unrelated deploys.
# govulncheck is call-graph aware: it only reports vulnerabilities in
# code paths the binary can actually reach, so findings are worth
# acting on, not triaging away.
name: vuln

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  # Dependency and toolchain changes are scanned before they merge, not on
  # the next Monday.
  pull_request:
    paths:
      - go.mod
      - go.sum
      - Dockerfile
      - .github/workflows/vuln.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # to open an issue when the weekly scan fails
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Same embed stub the test jobs use - govulncheck loads
      # packages, and //go:embed all:dist fails without the dir.
      - name: Stub web assets for embed
        run: |
          mkdir -p internal/web/dist
          touch internal/web/dist/.keep

      # The tool, not our code, may need a newer Go than go.mod pins (x/vuln
      # v1.9.0 needs go >= 1.26, which made this job fail to install from
      # Oct 5 on). GOTOOLCHAIN=auto lets `go install` fetch that toolchain to
      # BUILD the tool; the scan below runs with the repo's own toolchain
      # (GOTOOLCHAIN=local), so stdlib findings are those of the toolchain
      # go.mod pins.
      - name: Install govulncheck
        env:
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          "$(go env GOPATH)/bin/govulncheck" ./...

      # A red scheduled run went unnoticed for ten weeks. Make it loud: open
      # (or comment on) one issue per failing streak.
      - name: Open an issue when the weekly scan fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="govulncheck weekly scan is failing"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          body="The scheduled vuln scan failed: $RUN_URL"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
