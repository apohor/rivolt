# Auto-generate GitHub Release notes for every vX.Y.Z tag, and a prerelease for every vX.Y.Z-rc.N tag.
#
# The SPA footer links each running version to its release page —
# without this workflow the link 404s for any tag that wasn't
# released manually. `gh release create --generate-notes` walks
# PRs + commits since the previous tag and renders them into the
# release body, so the link is always useful.
#
# Idempotent: running again on the same tag silently fails the
# create call (the release already exists) and the step exits 0.
#
# The body starts with <!-- rivolt:auto-notes -->: it is the
# placeholder until the hand-written notes replace it, and
# release-channels.yml announces only hand-written notes.
name: release-notes

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Fetch full history so the previous-tag walk can resolve
          # what changed in this release.
          fetch-depth: 0

      - name: Create release with commit-derived notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # vX.Y.Z is a release; vX.Y.Z-rc.N is a release candidate: a prerelease that is never "Latest" (the SPA footer and anyone
          # watching releases must not see an rc as current). Any other tag shape makes no release.
          kind=$(bash .github/ci/tag-kind.sh "$TAG") || { echo "::error::$TAG is neither vX.Y.Z nor vX.Y.Z-rc.N: no release created."; exit 1; }
          flags=()
          [ "$kind" = rc ] && flags=(--prerelease --latest=false)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi
          # `--generate-notes` only enumerates merged PRs and this
          # repo lands every change as a direct push to main, so the
          # GitHub-side generator produces an empty list. Build the
          # body from `git log` between the previous tag and HEAD
          # instead — first-line subjects, bullet-formatted.
          # The previous RELEASE: v-tags only, and no prerelease, so v0.40.21's notes read "since v0.40.20", not "since v0.40.21-rc.2"
          # (and an rc's notes read since the last release too). A bare describe also found ios-v0.2.31 once.
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude="$TAG" --exclude='*-*' 2>/dev/null || true)"
          {
            # Marks the body as the generated commit list, not the
            # hand-written notes that replace it (gh release edit). The
            # release-channels workflow posts nothing for a marked body.
            echo "<!-- rivolt:auto-notes -->"
            if [ -n "$PREV" ]; then
              echo "## Changes since $PREV"
              echo
              git log --pretty=format:'- %s (%h)' "$PREV..$TAG"
              echo
              echo
              echo "**Full Changelog**: https://github.com/$REPO/compare/$PREV...$TAG"
            else
              echo "## Initial release"
              echo
              git log --pretty=format:'- %s (%h)' "$TAG"
            fi
          } > /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md "${flags[@]}"
