name: tmp-final-gate-proof
on: pull_request
jobs:
  proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/ci
      - id: infra-read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RIVOLT_INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.RIVOLT_INFRA_APP_KEY }}
          owner: apohor
          repositories: rivolt-infra
          permission-contents: read
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFRA_TOKEN: ${{ steps.infra-read.outputs.token }}
          GH_REPO: ${{ github.repository }}
          INFRA_REPO: apohor/rivolt-infra
        run: |
          git fetch -q --tags origin
          bash .github/ci/final-gate.sh v0.41.25 "$(git rev-parse 'v0.41.25-rc.1^{commit}')" || echo "final-gate exit $?"
