name: ios-store-screenshots

# App Store screenshots of the real app on the demo truck (made-up data): a debug build launched with
# -rivolt-store-shot <screen> opens demo.rivolt.dev's sample truck on that screen, a simulator of each App Store size
# shoots it, and ios/tools/store_shots.py frames each with its caption and the "Sample truck, generated data" line.
# Manual (the lead or ux dispatches it) or a PR labelled store-shots. No signing, no secret; the shots are an artifact.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
    paths:
      - "ios/tools/store_shots.py"
      - ".github/workflows/ios-store-screenshots.yml"
      - "ios/Rivolt/Views/StoreShots.swift"

permissions:
  contents: read

concurrency:
  group: ios-store-shots-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_26.3.app
  SIM_RUNTIME: iOS 26.2
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'store-shots')
    runs-on: macos-15
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: "6.9"
            device: "iPhone 17 Pro Max"
          - size: "6.5"
            device: "iPhone 11 Pro Max"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Create the simulator
        id: sim
        run: |
          set -euo pipefail
          rt="com.apple.CoreSimulator.SimRuntime.iOS-$(echo "${SIM_RUNTIME#iOS }" | tr . -)"
          xcrun simctl list devicetypes | grep iPhone | tail -12
          type=$(xcrun simctl list devicetypes -j | jq -r --arg n "${{ matrix.device }}" '.devicetypes[] | select(.name == $n) | .identifier')
          if [ -z "$type" ]; then echo "no device type named ${{ matrix.device }}"; exit 1; fi
          udid=$(xcrun simctl create "store-${{ matrix.size }}" "$type" "$rt")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build for the simulator (a debug build, which has the launch argument)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios/Rivolt.xcodeproj \
            -scheme Rivolt \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            -quiet

      - name: Shoot the screens
        timeout-minutes: 70
        run: |
          set -uo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Rivolt.app"
          test -d "$app"
          bid=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # The usual status bar: 9:41, full battery and signal.
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3
          xcrun simctl install "$udid" "$app"
          mkdir -p "$RUNNER_TEMP/raw"
          failed=0
          shoot() {  # name, mode, launch args...
            local name=$1 mode=$2; shift 2
            xcrun simctl ui "$udid" appearance "$mode"
            xcrun simctl launch --terminate-running-process "$udid" "$bid" "$@" || { echo "launch failed: $name $mode"; failed=1; return; }
            # The sample truck's answers come over the network, and a detail screen loads its charts after that.
            case "$name" in now|drive|charge) sleep 110 ;; *) sleep 40 ;; esac
            out="$RUNNER_TEMP/raw/$name-$mode.png"
            for try in 1 2 3; do
              xcrun simctl io "$udid" screenshot "$out" || true
              [ -f "$out" ] && [ "$(stat -f%z "$out")" -gt 20000 ] && break
              sleep 5
            done
            [ -f "$out" ] || failed=1
            # The demo server limits how many heavy reads one client may make a minute: let the budget refill before the next launch.
            sleep 70
          }
          for mode in dark light; do
            for name in now money drive charge truck; do shoot "$name" "$mode" -rivolt-store-shot "$name"; done
            shoot trust "$mode" -rivolt-preview signin
          done
          ls -l "$RUNNER_TEMP/raw"
          exit "$failed"

      - name: Frame them with their captions
        if: always()
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          for mode in dark light; do
            "$RUNNER_TEMP/venv/bin/python" ios/tools/store_shots.py "$RUNNER_TEMP/raw" "$RUNNER_TEMP/store/${{ matrix.size }}" "$mode"
          done

      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: store-screenshots-${{ matrix.size }}
          path: |
            ${{ runner.temp }}/store
            ${{ runner.temp }}/raw
          retention-days: 14
