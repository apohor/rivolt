name: Renovate

on:
  schedule:
    # Every 2h, every day. Renovate's own schedule ("on monday", in
    # renovate.json) still limits creating and rebasing branches to Monday,
    # but a PR whose checks went green is merged by the next run on any
    # day (automergeSchedule: at any time), so a green PR reaches preview
    # within about 2h instead of waiting for the next Monday.
    - cron: "17 */2 * * *"
  # GitHub drops scheduled runs under load (Oct 19: 4–9 h between them, not
  # 2 h), so also run when CI finishes on a Renovate branch: a PR that just
  # went green is merged within minutes. The run uses this file and
  # renovate.json from main, never code from the PR branch.
  workflow_run:
    workflows: [build, vuln]
    types: [completed]
    branches: ["renovate/**"]
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        type: choice
        default: info
        options: [debug, info]
      dryRun:
        description: "Dry run (no PRs)"
        type: choice
        default: "false"
        options: ["false", "full"]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # Only a green run on this repo's own branch: a fork PR can name its
    # branch renovate/x too.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || 'false' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
