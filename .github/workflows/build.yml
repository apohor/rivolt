# Build, test, and publish the rivolt container image.
#
# Triggers / outputs:
#   - Push to main        → tests + build 'sha-<short>' & 'main',
#                          auto-bump rivolt-infra preview values
#   - Push to release/**  → tests + build 'sha-<short>' only (hotfix line
#                          cut from a release tag; no preview bump). Tag
#                          the release-branch commit to ship it to prod.
#   - Push of vX.Y.Z tag  → retag-only: attach 'vX.Y.Z' / 'X.Y' / 'latest'
#                          to the existing 'sha-<short>' manifest at the
#                          tagged commit. No tests, no rebuild — the same
#                          bytes that soaked on preview become prod.
#   - Pull request        → tests only
#   - workflow_dispatch   → tests + build (manual rebuild path)
#
# Preview deploys continuously off main; prod stays pinned to whatever
# tag apps/platform/rivolt/app.yaml in rivolt-infra points at.
name: build

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*.*.*"]
    # Non-code paths build nothing, except Markdown under web/: that is
    # shipped page content (web/src/content/privacy.md, terms.md). Later
    # patterns override earlier ones. Tag pushes ignore path filters.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!deploy/**"
      - "!docker-compose*.yml"
      - "!LICENSE"
      - "!.editorconfig"
      - "web/**"
  # No paths-ignore on PRs: a workflow that never runs never reports the
  # required checks (go, integration, web), so a docs-only PR could not
  # merge. The `changes` job below skips the test jobs instead, and a
  # skipped job counts as success for a required check.
  # `edited` is here for ONE reason: retargeting a PR (changing its base)
  # must re-run CI against the new base. It also fires on title/body edits,
  # which simply re-run CI as well. They are deliberately NOT skipped: a
  # skipped job reports success, and a skipped run's checks (same names as
  # the required ones) could mask an earlier failure on the same commit.
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma-separated) for the published image"
        required: false
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

# PRs cancel a superseded run (only the newest head matters). Pushes to
# main/release/** and tags never cancel: during a merge burst, cancelling
# meant no main build finished (31 of 40 cancelled on 2026-10-16), so
# preview never got an image. Without cancel, the running build finishes
# and GitHub keeps only the newest pending run, so there's a fresh image
# at least every build-length even mid-burst.
# PRs: one run per branch, a new push cancels the superseded run.
# Pushes (main, release/**, tags): every run gets its own group, so builds
# run side by side instead of queueing behind each other (a burst of five
# merges no longer serialises into ~25 min before preview moves). Ordering
# is enforced where it matters, in bump-preview (a newest-wins check that
# retries a rejected push), so a slower older build can't roll preview back.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.ref) || format('build-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which halves of the repo a PR touches. Pushes (main, release/**,
  # dispatch) always run everything. A job skipped by `if:` reports
  # success to required status checks, so web-only PRs don't wait on
  # the Go/integration suites and Go-only PRs don't wait on web.
  changes:
    name: changes
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      go: ${{ steps.f.outputs.go }}
      chart: ${{ steps.f.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"; echo "chart=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Non-code paths (the ones push events ignore) trigger nothing.
          # Markdown under web/ is shipped page content, so it still counts.
          # A PR checks out refs/pull/N/merge: the PR merged into the base
          # branch as it is *now*. github.event.pull_request.base.sha can be
          # older than that (main moved after the event), so BASE...HEAD
          # would also count everything merged to main since, and a
          # README-only PR ran every suite. HEAD^1 is the base tip the merge
          # was built on, so HEAD^1..HEAD is exactly what this PR changes.
          if git rev-parse -q --verify HEAD^2 >/dev/null; then RANGE="HEAD^1 HEAD"; else RANGE="$BASE...HEAD"; fi
          files=$(git diff --name-only $RANGE | grep -v -E '^docs/|^deploy/|^docker-compose[^/]*\.yml$|^LICENSE$|^\.editorconfig$' | awk '!/\.md$/ || /^web\//' || true)
          echo "$files"
          # web: anything under web/. go: anything else that isn't web/
          # (Go code, go.mod, migrations, embedded data, the Dockerfile,
          # this workflow). Workflow edits run both halves.
          web=false; go=false
          if echo "$files" | grep -q '^web/'; then web=true; fi
          if echo "$files" | grep -v '^web/' | grep -q .; then go=true; fi
          # The web suite also reads the shared charger-network vectors
          # (chargerNetwork.vectors.test.ts), so a change there runs web too.
          if echo "$files" | grep -q '^internal/dcfcrates/testdata/'; then web=true; fi
          if echo "$files" | grep -q '^\.github/'; then web=true; go=true; fi
          # chart: the Helm chart, which the filter above drops with the rest of
          # deploy/ (no Go or web suite needs it), so it is matched on the full
          # diff. Workflow edits run it too.
          chart=false
          if git diff --name-only $RANGE | grep -q -E '^deploy/helm/|^\.github/'; then chart=true; fi
          echo "web=$web" >> "$GITHUB_OUTPUT"; echo "go=$go" >> "$GITHUB_OUTPUT"; echo "chart=$chart" >> "$GITHUB_OUTPUT"
      # Personal data that must never come back into the tree (real coordinates, ids), one fixed string per
      # line in the PRIVACY_DENYLIST secret, so the values themselves are never in the repo. Only file names
      # are printed. Skipped where the secret isn't available (a fork, or not set yet). Real Rivian ids are
      # also caught without the secret by internal/privacy's test.
      - name: Personal-data denylist
        env:
          DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then echo "PRIVACY_DENYLIST is not set: skipped"; exit 0; fi
          deny="$RUNNER_TEMP/deny"
          printf '%s\n' "$DENYLIST" | sed '/^[[:space:]]*$/d' > "$deny"
          hits=$(git grep -l -F -f "$deny" -- . || true)
          rm -f "$deny"
          if [ -n "$hits" ]; then echo "Personal data from the denylist is in:"; echo "$hits"; exit 1; fi
          echo "No denylisted values in the tree."

  web:
    name: web
    needs: changes
    # Skip on tag pushes — the retag job aliases an already-tested
    # main-built image, so the SPA bundle / Go vet / Go test results
    # would just repeat themselves. PRs + main pushes + workflow_dispatch
    # still run.
    if: "!startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.web == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Type-check web
        working-directory: web
        run: npx tsc --noEmit

      # Lint is intentionally separate from typecheck — typecheck
      # has historically passed even when a Rules of Hooks violation
      # blanked the page on hard refresh. ESLint with
      # react-hooks/rules-of-hooks catches that class of bug at CI
      # time so the next regression fails the build, not the user.
      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Test web
        working-directory: web
        run: npm run test:run

      - name: Build web
        working-directory: web
        run: npm run build

  # The Helm chart: chart-testing lint (yamllint, Chart.yaml schema and, on PRs, a
  # version bump for any chart change), helm lint --strict and a render of every
  # deploy/helm/rivolt/ci/*-values.yaml case (defaults, CNPG, existingSecret,
  # prod-like) through kubeconform -strict, with CRD schemas (CNPG,
  # Prometheus operator) from the datree catalog. A render with no KEK must
  # fail, as the chart promises. PRs that touch deploy/helm (or .github) only.
  chart:
    name: chart
    needs: changes
    if: "!startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.chart == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHART: deploy/helm/rivolt
      KUBE_VERSION: "1.35.0"
      # Bump each version with its tarball's sha256 (from the release's
      # checksums file). ct's Python linters: .github/ct-requirements.txt.
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      CT_VERSION: 3.15.0
      CT_SHA256: 467561730f25fe09d5e6cd09a3e1f6aa759871c657a57602947c716d9be2c583
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # ct compares with origin/main

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1

      # chart-testing and kubeconform from their releases, checked against
      # pinned sha256s (helm/chart-testing-action failed in its own cosign
      # step), with ct's Python linters hash-pinned in a venv.
      - name: Install ct and kubeconform
        run: |
          cd "$RUNNER_TEMP"
          ct="https://github.com/helm/chart-testing/releases/download/v${CT_VERSION}"
          curl -fsSLO "$ct/chart-testing_${CT_VERSION}_linux_amd64.tar.gz"
          echo "${CT_SHA256}  chart-testing_${CT_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          mkdir ct && tar xzf "chart-testing_${CT_VERSION}_linux_amd64.tar.gz" -C ct
          kc="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "$kc/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          python3 -m venv venv
          venv/bin/pip install --quiet --require-hashes --only-binary :all: -r "$GITHUB_WORKSPACE/.github/ct-requirements.txt"
          { echo "$RUNNER_TEMP"; echo "$RUNNER_TEMP/ct"; echo "$RUNNER_TEMP/venv/bin"; } >> "$GITHUB_PATH"

      - name: ct lint
        run: |
          # PRs: the charts changed against main, which must bump their version.
          # Pushes: nothing differs from main, so lint every chart, no bump check.
          extra=""
          [ "${{ github.event_name }}" = "pull_request" ] || extra="--all --check-version-increment=false"
          ct lint --config .github/ct.yaml \
            --lint-conf "$RUNNER_TEMP/ct/etc/lintconf.yaml" --chart-yaml-schema "$RUNNER_TEMP/ct/etc/chart_schema.yaml" $extra

      - name: helm lint --strict and kubeconform, per values case
        run: |
          set -o pipefail
          for f in "$CHART"/ci/*-values.yaml; do
            echo "::group::$(basename "$f")"
            helm lint --strict "$CHART" -f "$f"
            helm template rivolt "$CHART" -f "$f" \
              | kubeconform -strict -summary -kubernetes-version "$KUBE_VERSION" \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

      - name: No KEK, no render
        run: |
          if out=$(helm template rivolt "$CHART" --set externalDatabase.host=db.invalid 2>&1); then
            echo "::error::the chart rendered without secrets.kek or secrets.existingSecret"; exit 1
          fi
          echo "$out" | grep -q 'rivolt: set secrets.kek' || { echo "$out"; echo "::error::unexpected failure"; exit 1; }

  # Functional Playwright specs (ui-next-*), against `vite preview` and the stub
  # API (web/e2e/stub.ts): no backend, no real data. PRs that touch web only.
  # The visual-regression spec stays opt-in (E2E_VISUAL): its baselines carry
  # the OS and do not match Linux. Three shards in parallel; each builds the SPA
  # itself so the shards never wait on each other. Not a required check yet.
  e2e:
    name: e2e (${{ matrix.suite }} ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: changes
    if: "github.event_name == 'pull_request' && needs.changes.outputs.web == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # next: the ui-next-* specs, flag on (and their flag-off twins).
          - { suite: next, project: chromium, shard: 1, total: 3 }
          - { suite: next, project: chromium, shard: 2, total: 3 }
          - { suite: next, project: chromium, shard: 3, total: 3 }
          # WebKit = the iPhone Safari engine: the phone specs only (see
          # web/playwright.config.ts), one shard.
          - { suite: next, project: webkit, shard: 1, total: 1 }
          # legacy: every other spec (flag off, the pre-redesign pages and the
          # demo), so a regression in the old UI shows up in CI too.
          - { suite: legacy, project: chromium, shard: 1, total: 3 }
          - { suite: legacy, project: chromium, shard: 2, total: 3 }
          - { suite: legacy, project: chromium, shard: 3, total: 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund

      # The browser cache is keyed on Playwright's own version (the lockfile entry for
      # playwright-core), not on the whole lockfile: any unrelated dependency bump
      # changed the lockfile hash, missed the cache and sent every shard to download
      # Chromium (280 to 630 s a shard, against 90 to 190 s of tests).
      - name: Playwright version
        id: pw-ver
        working-directory: web
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      # The browser download is the slow part. The cache is saved only by the
      # main-only `playwright-cache` job below (a PR's own cache is readable
      # only from that PR, so per-PR copies never hit and filled the repo's
      # Actions budget); PRs just restore main's. System libraries are not in
      # the cache: web/scripts/pw-system-deps.sh installs them only when the
      # browser's binary reports a missing one (apt from a slow mirror took up
      # to 10 minutes of a shard that runs 2-3 minutes of tests).
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ steps.pw-ver.outputs.version }}

      - name: Install Playwright browser
        working-directory: web
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install ${{ matrix.project }}
          fi
          ./scripts/pw-system-deps.sh ${{ matrix.project }}

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Playwright (${{ matrix.suite }}, ${{ matrix.project }})
        working-directory: web
        env:
          CI: "true"
          E2E_WEBKIT: "1"
          SUITE: ${{ matrix.suite }}
        run: |
          # ui-next-*.pw.ts is the "next" suite; every other spec is "legacy"
          # (ui-next.pw.ts, the prototype spec, has no dash after "next").
          if [ "$SUITE" = "next" ]; then files="ui-next-"; else files=$(ls e2e/*.pw.ts | grep -v '^e2e/ui-next-'); fi
          npx playwright test $files --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-${{ matrix.suite }}-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/e2e/__screenshots__
            web/e2e/__results__
          if-no-files-found: ignore
          retention-days: 7

  # Keeps main's Playwright browser cache current for the e2e job's PRs. Only
  # does work when the lockfile (the Playwright version) changed.
  playwright-cache:
    name: playwright-cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true   # a warm-up must never turn main red
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund

      # Same key as the e2e job's restore: the browser cache is keyed on Playwright's own version (the lockfile entry for
      # playwright-core), not on the whole lockfile: any unrelated dependency bump
      # changed the lockfile hash, missed the cache and sent every shard to download
      # Chromium (280 to 630 s a shard, against 90 to 190 s of tests).
      - name: Playwright version
        id: pw-ver
        working-directory: web
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ steps.pw-ver.outputs.version }}

      - name: Download the browser on a miss (saved by the cache post step)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install ${{ matrix.project }}

  # The single required check for the e2e matrix. A matrix job skipped by its
  # job-level `if` reports under the unexpanded template name, so requiring
  # "e2e (chromium 1/3)" would never report on a backend-only PR. This one always
  # runs: green when the matrix passed or was skipped, red otherwise.
  # !cancelled(), not always(): an always() job still runs in a run that
  # concurrency cancelled (a newer push to the PR), and with `changes`
  # cancelled it went red. That red check stays on the same head SHA next to
  # the newer run's green one, and Renovate's automerge reads the branch as
  # failing (#39 sat unmerged). A cancelled run now leaves e2e-ok skipped.
  e2e-ok:
    name: e2e-ok
    needs: [changes, e2e]
    if: "!cancelled() && !startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - name: Matrix result
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES, e2e: $RESULT"
          # A failed `changes` skips e2e; that must not read as green.
          [ "$CHANGES" = "success" ] || exit 1
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  go:
    name: go
    needs: changes
    if: "!startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.go == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      # setup-go's own cache saves only when its key (go.sum) misses, so after
      # the first run the build and test-result cache is never refreshed and
      # every commit recompiles what changed. Restore the newest cache by
      # prefix and save a fresh one from main pushes only (PRs read main's),
      # at most once per UTC day: the key ends in the date, not the commit.
      # A per-commit key saved ~3.5 GB here plus ~2 GB in integration on
      # every merge, and a burst of merges pushed the repo past its 10 GB
      # Actions cache limit, evicting the image layers publish rebuilds
      # from (publish went from ~30 s to 2-3 min on Oct 20).
      - name: Cache day
        id: day
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # go.mod is in the key so a Go toolchain bump starts a fresh cache: with
      # only go.sum, the day's key still hit after #802 (go1.27.3), the save
      # was skipped, and every run rebuilt from objects for the old toolchain
      # (go 195 s -> 347 s).
      - name: Restore Go build and module cache
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-unit-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ steps.day.outputs.d }}
          restore-keys: |
            go-unit-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-unit-${{ runner.os }}-

      # Satisfy `//go:embed all:dist` without running the vite build.
      # Assets() returns nil at runtime when index.html is absent, so
      # the stub is safe for vet/test.
      - name: Stub web assets for embed
        run: |
          mkdir -p internal/web/dist
          touch internal/web/dist/.keep

      # -race because the data plane is goroutine-heavy (lease
      # coordinator, per-user monitors, atomic reauth state); the
      # detector turns latent races into hard failures here instead
      # of heisenbugs in prod.
      # vet runs alongside the tests instead of before them; both
      # must pass.
      - name: go vet + go test
        run: |
          go vet ./... > vet.log 2>&1 & vet=$!
          go test -race ./...; t=$?
          wait $vet; v=$?
          cat vet.log
          exit $(( t != 0 || v != 0 ))

      - name: Save Go build and module cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  # golangci-lint (config: .golangci.yml, the standard set), as its own job so it
  # runs beside `go` and adds nothing to the critical path, and so a lint finding
  # never hides test results. NOT a required check until it has stayed green; main
  # is at 0 issues. The linter version is pinned here (never `latest`); Renovate
  # bumps it through the annotation below (preset customManagers:githubActionsVersions)
  # and the action through its digest.
  lint:
    name: lint
    needs: changes
    if: "!startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.go == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=golangci/golangci-lint
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      # The Go module cache (and build cache) the `go` job saves from main, by the same
      # prefix. RESTORE ONLY: this job never saves, so a PR cannot write the cache, and
      # setup-go's own cache stays off so two caches do not fight over ~/go/pkg/mod.
      # Without it every run downloaded all modules cold, and a dropped connection to
      # proxy.golang.org failed the job. A miss (a go.sum change before main has saved)
      # still falls back to downloading.
      - name: Restore Go build and module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-unit-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-restore-only
          restore-keys: |
            go-unit-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-

      # Satisfy `//go:embed all:dist` without running the vite build (as in `go`).
      - name: Stub web assets for embed
        run: |
          mkdir -p internal/web/dist
          touch internal/web/dist/.keep

      # The action caches the linter's analysis cache and the Go build cache.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout 5m

  integration:
    name: integration
    needs: changes
    if: "!startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.go == 'true'"
    runs-on: ubuntu-latest
    # GitHub-hosted ubuntu runners ship Docker, which testcontainers-go
    # talks to over the default unix socket — no extra service: block
    # needed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      # Same daily cache as the go job (see the comment there).
      - name: Cache day
        id: day
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Go build and module cache
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-integration-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ steps.day.outputs.d }}
          restore-keys: |
            go-integration-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-integration-${{ runner.os }}-

      # Pre-pull so the testcontainers run-time isn't dominated by the
      # postgres image fetch. ~80MB, cached across runs by docker.
      - name: Pull postgres image
        run: docker pull postgres:16-alpine

      - name: go test (integration)
        # Every package with an integration-tagged test runs, found from
        # the build tag rather than a hand-kept list: the list missed
        # appauth, push, sessions, demo and rivian, so their Postgres
        # tests never ran in CI (found on #789, 2026-10-21). The listing
        # is printed so the log shows what ran.
        run: |
          pkgs=$(grep -rl --include='*_test.go' '^//go:build integration' internal cmd 2>/dev/null | xargs -n1 dirname | sort -u | sed 's#^#./#')
          [ -n "$pkgs" ] || { echo "no integration packages found" >&2; exit 1; }
          echo "integration packages:"; echo "$pkgs"
          go test -tags=integration -count=1 -timeout=10m $pkgs

      - name: Save Go build and module cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  # Keeps the repo's Actions cache from filling up. The Go caches are saved once a UTC
  # day under a new key (so the build cache is refreshed), and the old day's entry
  # stayed until GitHub evicted it for space: two ~3.9 GB + ~2.3 GB generations
  # never fit in the 10 GB limit with the image layers and the Playwright browsers,
  # so every daily refresh evicted something people were still using (a miss on
  # publish's image layers or the browser cache cost minutes). After main's Go jobs
  # have saved, keep only the newest entry of each Go cache and of each Playwright
  # browser (a Playwright bump leaves the old version's entry behind too).
  # Its own job so the actions:write token never reaches the jobs that run PR code.
  # Main pushes only; a failure here never turns main red.
  cache-prune:
    name: cache-prune
    needs: [go, integration]
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.go.result == 'success' && needs.integration.result == 'success'"
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Keep the newest cache of each kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in go-unit-Linux- go-integration-Linux- playwright-Linux-chromium- playwright-Linux-webkit-; do
            ids=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$prefix" --sort created_at --order desc --limit 100 --json id,key,sizeInBytes \
              | jq -r '.[1:][] | "\(.id) \(.key) \(.sizeInBytes)"')
            kept=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$prefix" --sort created_at --order desc --limit 1 --json key -q '.[0].key')
            echo "$prefix keeps $kept"
            echo "$ids" | while read -r id key size; do
              [ -n "$id" ] || continue
              echo "  deleting $key ($((size / 1048576)) MB)"
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
            done
          done

  image:
    name: image
    # Builds the image while the tests run, without pushing or tagging
    # anything (no registry login here), so publish can rebuild it from a
    # warm cache in seconds once the tests pass. The cache goes to this
    # commit's own scope too: main builds run side by side, and another
    # commit's export can replace the shared scope's index in between.
    # No needs: it starts with the first jobs.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      devtag: ${{ steps.ver.outputs.devtag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # fetch-tags so the version stamp below can read the prior
          # release with `git describe`.
          fetch-tags: true
          fetch-depth: 0

      # Compose a human-legible VERSION stamp for the binary. On main:
      # "<last-release-tag>+sha-<short>" so the SPA footer can show
      # "v0.19.13+sha-6001e6a" instead of an opaque hash. Tag pushes
      # take the retag path (separate job below) and don't reach here.
      - name: Compute VERSION stamp
        id: ver
        # Semver pre-release for builds that aren't a release, so preview
        # versions sort and read in order: main → next minor (v0.33.2 + 15
        # commits = v0.34.0-dev.15), release/** → next patch
        # (v0.33.3-dev.N). N = commits since the last tag, monotonic on a
        # branch. The sha stays as build metadata; images also get the
        # dev tag (no "+", which Docker tags don't allow).
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
          n=$(git rev-list --count "${last_tag}..HEAD" 2>/dev/null || echo 0)
          IFS=. read -r ma mi pa <<< "${last_tag#v}"
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then next="${ma}.${mi}.$((pa+1))"; else next="${ma}.$((mi+1)).0"; fi
          short="sha-${GITHUB_SHA:0:7}"
          echo "version=v${next}-dev.${n}+${short}" >> "$GITHUB_OUTPUT"
          echo "devtag=${next}-dev.${n}" >> "$GITHUB_OUTPUT"
          echo "VERSION v${next}-dev.${n}+${short}"

      # No QEMU needed: the Dockerfile runs web/go stages on $BUILDPLATFORM
      # and cross-compiles Go to linux/arm64 via GOOS/GOARCH. The runtime
      # stage is COPY-only, so arm64 images are produced without emulation.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          # amd64 is the DSM target and the only platform Rivolt is
          # currently deployed on. Multi-arch builds roughly double
          # the image stage time, so arm64 is opt-in via
          # workflow_dispatch (`platforms` input) for the rare
          # cases we need to publish both.
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: false
          provenance: false
          # Stamp our computed VERSION into the Go binary so /api/health
          # and the Overview subtitle report it (e.g. v0.19.13+sha-... on
          # preview, bare semver on workflow_dispatch-rebuilt tags).
          # publish passes the same value, so its rebuild hits this cache.
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: |
            type=gha,mode=max
            type=gha,mode=max,scope=sha-${{ github.sha }}

  publish:
    name: publish
    # Only a commit whose tests passed gets an image. Building in parallel
    # pushed sha-<short> for red commits too, and bump-preview only waited
    # for the tests when a migration was in range, so a red commit could
    # reach preview. (tag-validate still requires a fully green run for
    # prod.) needs: skips publish, and with it bump-preview, when any of
    # these fail. The build itself already ran in `image`; this rebuilds it
    # from that cache and pushes.
    needs: [image, go, integration, web]
    outputs:
      version: ${{ needs.image.outputs.version }}
    # Build & push the image. Main pushes and workflow_dispatch only;
    # tag pushes take the retag-only path below (skipping tests, since
    # the code already shipped to preview).
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # reserved for future cosign signing
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}  # e.g. apohor/rivolt
    steps:
      # Shallow: the version stamp comes from the image job.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag set: this job only runs on main pushes + workflow_dispatch.
          # workflow_dispatch on a tag ref still gets the semver shape.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
            type=raw,value=${{ needs.image.outputs.devtag }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}

      # Same inputs as the image job's build, so every step is a cache hit
      # and this only assembles and pushes. If the cache was evicted it
      # builds from scratch: slower, same image.
      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ needs.image.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=sha-${{ github.sha }}
            type=gha

  bump-preview:
    name: bump-preview
    # Waits for the image only. The tests already ran green on the PR; a red
    # main still blocks the next tag via tag-validate. The one exception is a
    # migration in the range being deployed: see the step below.
    needs: [publish, changes]
    # Only after a successful main image publish (a push, or a manual run on
    # main) — tag pushes go to prod manually, not via this auto-bump.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No job-level concurrency: a pending job superseded in a concurrency
    # group is cancelled, which would mark that commit's run cancelled and
    # make tag-validate refuse it. Instead the step below retries on a
    # rejected push and re-checks newest-wins each attempt.
    permissions:
      contents: read
      actions: read   # poll this run's go/integration jobs when a migration ships
    steps:
      - name: Checkout rivolt-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: apohor/rivolt-infra
          # Fine-scoped PAT with contents:write on apohor/rivolt-infra.
          # The default GITHUB_TOKEN only has access to this repo.
          token: ${{ secrets.RIVOLT_INFRA_TOKEN }}

      - name: Bump preview image.tag (newest wins)
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION_STAMP: ${{ needs.publish.outputs.version }}
        run: |
          short="sha-${SHA:0:7}"
          file=apps/platform/rivolt-preview/values.yaml
          admin_file=apps/platform/rivolt-admin-preview/values.yaml
          git config user.name "rivolt-ci"
          git config user.email "ci@rivolt.dev"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            # Builds run in parallel, so an older commit's build can finish
            # after a newer one's: only move preview forward.
            prev=$(grep -E '^[[:space:]]+tag:[[:space:]]+sha-[0-9a-f]+' "$file" | head -1 | sed -E 's/.*sha-([0-9a-f]+).*/\1/')
            if [ -n "$prev" ]; then
              prev_full=$(gh api "repos/$REPO/commits/$prev" --jq .sha 2>/dev/null || true)
              rel=unknown
              [ -n "$prev_full" ] && rel=$(gh api "repos/$REPO/compare/$prev_full...$SHA" --jq .status 2>/dev/null || echo unknown)
              echo "preview runs ${prev}; this build ${SHA:0:7} is '${rel}' relative to it"
              case "$rel" in
                behind|identical) echo "preview already has this or newer; skipping."; exit 0 ;;
                ahead|diverged)
                  # A bad migration can't be undone on preview's DB, so when the
                  # range being deployed (preview's commit..this one, which also
                  # covers a migration merged just before this commit) touches
                  # internal/db/migrations, wait for go + integration first.
                  if gh api "repos/$REPO/compare/$prev_full...$SHA" --paginate --jq '.files[].filename' | grep -q '^internal/db/migrations/'; then
                    echo "a migration is in this range; waiting for go and integration."
                    for i in $(seq 1 100); do
                      res=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}/jobs" --jq '[.jobs[]|select(.name=="go" or .name=="integration")|.conclusion // "pending"]|sort|join(" ")')
                      case "$res" in
                        *failure*|*cancelled*|*timed_out*) echo "::error::go/integration did not pass ($res); not deploying a migration to preview."; exit 1 ;;
                      esac
                      [ "$res" = "success success" ] && break
                      sleep 15
                    done
                    [ "$res" = "success success" ] || { echo "::error::timed out waiting for go/integration ($res)"; exit 1; }
                  fi
                  ;;
                # An API blip must not roll preview back mid-QA; the next
                # merge's build bumps it. "diverged" (preview pinned by hand
                # off main) falls through to the old always-bump behaviour.
                unknown) echo "::warning::couldn't compare ${prev} with ${SHA:0:7}; not bumping."; exit 0 ;;
              esac
            fi
            # Rewrite `  tag: sha-xxxxxxx`, preserving indent. The preview
            # admin site (rivolt-admin-preview) moves with it in the same
            # commit: it shares preview's DB and migrates on boot, so it
            # must never run ahead of (or drift behind) preview.
            files=("$file")
            [ -f "$admin_file" ] && files+=("$admin_file")
            sed -i -E "s/^([[:space:]]+tag:)[[:space:]]+sha-[0-9a-f]+/\1 ${short}/" "${files[@]}"
            if git diff --quiet "${files[@]}"; then echo "image.tag unchanged; nothing to commit."; exit 0; fi
            git add "${files[@]}"
            git commit -q -m "rivolt-preview: bump image.tag to ${short} (${VERSION_STAMP})"
            if git push -q origin main; then echo "bumped to ${short}"; exit 0; fi
            echo "push rejected (another bump landed); retrying ($attempt)"
            sleep $((attempt * 3))
          done
          echo "::error::could not push the preview bump after 5 attempts"; exit 1

  tag-validate:
    name: tag-validate
    # Refuses tags pointing at a SHA that never had a successful main or
    # release/** push build. Without this, a tag at e.g. a docs-only commit
    # (CI skipped due to paths-filter) makes retag fail late with a
    # cryptic ImageManifestUnknown error. Fail fast with a clear
    # message instead.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Confirm SHA has a successful build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          # The tagged commit must have at least one successful build
          # workflow run targeting it. Tagging a docs-only commit (or
          # a commit before its main build finished) returns no rows.
          # A successful push build on main or on a release/** hotfix
          # branch both publish 'sha-<short>', so either qualifies.
          count=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow build.yml \
            --event push \
            --commit "$SHA" \
            --status success \
            --limit 20 \
            --json headBranch \
            --jq '[.[] | select(.headBranch == "main" or (.headBranch | startswith("release/")))] | length')
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::Tag ${{ github.ref_name }} points at $SHA which has no successful main or release/** build."
            echo "::error::Tag a commit that's already been built (and ideally soaked on preview)."
            exit 1
          fi
          echo "OK: $SHA has a successful build run."

  retag:
    name: retag
    needs: tag-validate
    # Tag pushes attach prod tags to the existing main-built image. No
    # rebuild and no test re-run — the tag is a promotion signal, not
    # a new build. tag-validate has already confirmed the source SHA
    # built; the wait-for-image step below covers the case where the
    # main build is still in flight when the tag landed.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for sha-<short> on GHCR
        env:
          SHA: ${{ github.sha }}
          IMAGE: ghcr.io/${{ github.repository }}
        # Race guard: when a tag is pushed immediately after a main
        # commit, this job can start before the main build's publish
        # step has uploaded sha-<short>. Poll for up to 10 minutes
        # with a 10s cadence; fail loudly if the image truly never
        # appears (tag-validate should have caught that case earlier,
        # but defense in depth).
        run: |
          short="sha-${SHA:0:7}"
          for i in $(seq 1 60); do
            if docker buildx imagetools inspect "${IMAGE}:${short}" >/dev/null 2>&1; then
              echo "OK: ${IMAGE}:${short} is available (attempt ${i})."
              exit 0
            fi
            echo "attempt ${i}: ${short} not yet on GHCR, sleeping 10s…"
            sleep 10
          done
          echo "::error::${IMAGE}:${short} never appeared on GHCR after 10 minutes."
          exit 1

      - name: Retag sha-<short> → X.Y.Z / X.Y / latest
        env:
          VERSION: ${{ github.ref_name }}   # e.g. v0.19.13
          SHA: ${{ github.sha }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          short="sha-${SHA:0:7}"
          # Strip leading 'v' — GHCR tags are bare semver to match
          # docker/metadata-action's {{version}} output.
          v="${VERSION#v}"                  # 0.19.13
          minor="${v%.*}"                   # 0.19
          echo "Retagging ${IMAGE}:${short} → ${v} / ${minor} / latest"
          docker buildx imagetools create \
            --tag "${IMAGE}:${v}" \
            --tag "${IMAGE}:${minor}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${short}"

  bump-prod:
    name: bump-prod
    needs: retag
    # After retag attaches the prod tag to the existing image, rewrite
    # rivolt-infra's apps/platform/rivolt{,-admin}/{app.yaml,values.yaml} so ArgoCD picks
    # up the new version automatically. Removes the manual sed dance
    # that previously followed every tag push.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rivolt-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: apohor/rivolt-infra
          token: ${{ secrets.RIVOLT_INFRA_TOKEN }}

      - name: Bump prod image.tag + chart.version
        env:
          VERSION: ${{ github.ref_name }}   # e.g. v0.22.3
        run: |
          set -e
          v="${VERSION#v}"                  # 0.22.3 — image tag uses bare semver
          app=apps/platform/rivolt/app.yaml
          values=apps/platform/rivolt/values.yaml
          # chart.version tracks the git tag literally (ArgoCD resolves
          # against the rivolt repo ref); image.tag is the bare semver
          # that the retag job applied on GHCR.
          # The admin site (rivolt-admin, admin.rivolt.dev) moves with prod
          # in the same commit: it shares prod's DB and migrates on boot, so
          # it must never run ahead of (or drift behind) prod.
          apps=("$app")
          vals=("$values")
          if [ -f apps/platform/rivolt-admin/app.yaml ]; then
            apps+=(apps/platform/rivolt-admin/app.yaml)
            vals+=(apps/platform/rivolt-admin/values.yaml)
          fi
          sed -i -E "s/^([[:space:]]+version:)[[:space:]]+v[0-9]+\.[0-9]+\.[0-9]+/\1 ${VERSION}/" "${apps[@]}"
          sed -i -E "s/^([[:space:]]+tag:)[[:space:]]+\"[0-9]+\.[0-9]+\.[0-9]+\"/\1 \"${v}\"/" "${vals[@]}"
          if git diff --quiet "${apps[@]}" "${vals[@]}"; then
            echo "prod already on ${VERSION} — nothing to commit."
            exit 0
          fi
          git config user.name "rivolt-ci"
          git config user.email "ci@rivolt.dev"
          git add "${apps[@]}" "${vals[@]}"
          git commit -m "rivolt: promote ${VERSION} to prod"
          git push origin main
