# Build, test, and publish the rivolt container image.
#
# Triggers / outputs:
#   - Push to main        → tests + build 'sha-<short>' & 'main',
#                          auto-bump rivolt-infra preview values
#   - Push to release/**  → tests + build 'sha-<short>' only (hotfix line
#                          cut from a release tag; no preview bump). Tag
#                          the release-branch commit to ship it to prod.
#   - Push of vX.Y.Z tag  → retag-only: attach 'vX.Y.Z' / 'X.Y' / 'latest'
#                          to the existing 'sha-<short>' manifest at the
#                          tagged commit. No tests, no rebuild — the same
#                          bytes that soaked on preview become prod.
#   - Pull request        → tests only
#   - workflow_dispatch   → tests + build (manual rebuild path)
#
# Preview deploys continuously off main; prod stays pinned to whatever
# tag apps/platform/rivolt/app.yaml in rivolt-infra points at.
name: build

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*.*.*"]
    # Non-code paths build nothing, except Markdown under web/: that is
    # shipped page content (web/src/content/privacy.md, terms.md). Later
    # patterns override earlier ones. Tag pushes ignore path filters.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!deploy/**"
      - "!docker-compose*.yml"
      - "!LICENSE"
      - "!.editorconfig"
      - "web/**"
  # No paths-ignore on PRs: a workflow that never runs never reports the
  # required checks (go, integration, web), so a docs-only PR could not
  # merge. The `changes` job below skips the test jobs instead, and a
  # skipped job counts as success for a required check.
  # No `edited`: it re-ran (and, through the PR concurrency group, cancelled
  # the run in flight) on every title or body edit, for the one case of a
  # retargeted PR. PRs don't stack (they all target main), so a retarget is
  # rare: after one, close and reopen the PR or push to it to re-run CI
  # against the new base. Skipping the edit runs instead isn't safe: a
  # skipped job reports success under the required checks' names and could
  # mask an earlier failure on the same commit.
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma-separated) for the published image"
        required: false
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

# PRs cancel a superseded run (only the newest head matters). Pushes to
# main/release/** and tags never cancel: during a merge burst, cancelling
# meant no main build finished (31 of 40 cancelled on 2026-10-16), so
# preview never got an image. Without cancel, the running build finishes
# and GitHub keeps only the newest pending run, so there's a fresh image
# at least every build-length even mid-burst.
# PRs: one run per branch, a new push cancels the superseded run.
# Pushes (main, release/**, tags): every run gets its own group, so builds
# run side by side instead of queueing behind each other (a burst of five
# merges no longer serialises into ~25 min before preview moves). Ordering
# is enforced where it matters, in bump-preview (a newest-wins check that
# retries a rejected push), so a slower older build can't roll preview back.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.ref) || format('build-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which halves of the repo a PR touches. Pushes (main, release/**,
  # dispatch) always run everything. A job skipped by `if:` reports
  # success to required status checks, so web-only PRs don't wait on
  # the Go/integration suites and Go-only PRs don't wait on web.
  changes:
    name: changes
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.f.outputs.web }}
      go: ${{ steps.f.outputs.go }}
      chart: ${{ steps.f.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"; echo "chart=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Non-code paths (the ones push events ignore) trigger nothing.
          # Markdown under web/ is shipped page content, so it still counts.
          # A PR checks out refs/pull/N/merge: the PR merged into the base
          # branch as it is *now*. github.event.pull_request.base.sha can be
          # older than that (main moved after the event), so BASE...HEAD
          # would also count everything merged to main since, and a
          # README-only PR ran every suite. HEAD^1 is the base tip the merge
          # was built on, so HEAD^1..HEAD is exactly what this PR changes.
          if git rev-parse -q --verify HEAD^2 >/dev/null; then RANGE="HEAD^1 HEAD"; else RANGE="$BASE...HEAD"; fi
          files=$(git diff --name-only $RANGE | grep -v -E '^docs/|^deploy/|^docker-compose[^/]*\.yml$|^LICENSE$|^\.editorconfig$' | awk '!/\.md$/ || /^web\//' || true)
          echo "$files"
          # web: anything under web/. go: anything else that isn't web/
          # (Go code, go.mod, migrations, embedded data, the Dockerfile,
          # this workflow). Workflow edits run both halves.
          web=false; go=false
          if echo "$files" | grep -q '^web/'; then web=true; fi
          if echo "$files" | grep -v '^web/' | grep -q .; then go=true; fi
          # The web suite also reads the shared charger-network vectors
          # (chargerNetwork.vectors.test.ts), so a change there runs web too.
          if echo "$files" | grep -q '^internal/dcfcrates/testdata/'; then web=true; fi
          # The API contract checks read across the two halves. The Go check that every route the web calls exists on the server
          # (internal/api/contract_routes_test.go) scans web/src's non-test .ts/.tsx, so a web-only PR that adds or changes an
          # "/api/..." literal must run the Go job (#1115 went red on main because it did not). Conversely the web check that the
          # types match the server fixtures (src/contract/*) reads ios/RivoltTests/Fixtures, so a fixture-only PR must run the web job
          # (iOS and fixture changes already count as Go: they are not under web/).
          if echo "$files" | grep -E '^web/src/.*\.tsx?$' | grep -v -E '\.test\.tsx?$' | grep -q .; then go=true; fi
          if echo "$files" | grep -q '^ios/RivoltTests/Fixtures/'; then web=true; fi
          if echo "$files" | grep -q '^\.github/'; then web=true; go=true; fi
          # chart: the Helm chart, which the filter above drops with the rest of
          # deploy/ (no Go or web suite needs it), so it is matched on the full
          # diff. Workflow edits run it too.
          chart=false
          if git diff --name-only $RANGE | grep -q -E '^deploy/helm/|^\.github/'; then chart=true; fi
          echo "web=$web" >> "$GITHUB_OUTPUT"; echo "go=$go" >> "$GITHUB_OUTPUT"; echo "chart=$chart" >> "$GITHUB_OUTPUT"
      # Personal data that must never come back into the tree (real coordinates, ids), one fixed string per
      # line in the PRIVACY_DENYLIST secret, so the values themselves are never in the repo. Only file names
      # and commit ids are printed. Skipped where the secret isn't available (a fork, or not set yet). Real
      # Rivian ids are also caught without the secret by internal/privacy's test.
      # On a PR it also checks every commit's added lines, not just the final tree: a value added in one
      # commit and removed in a later one is still in the branch's history, and our merge commits carry
      # that history onto main (#1079, Oct 24). Commit messages are checked too: they reach main the same way.
      # Such a PR stays red until its history is rewritten. PR titles and bodies aren't in git: a reviewer check.
      - name: Personal-data denylist
        env:
          DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then echo "PRIVACY_DENYLIST is not set: skipped"; exit 0; fi
          deny="$RUNNER_TEMP/deny"
          printf '%s\n' "$DENYLIST" | sed '/^[[:space:]]*$/d' > "$deny"
          trap 'rm -f "$deny"' EXIT
          fail=0
          hits=$(git grep -l -F -f "$deny" -- . || true)
          if [ -n "$hits" ]; then echo "Personal data from the denylist is in:"; echo "$hits"; fail=1; fi
          # A PR checks out its merge commit: HEAD^1 is the base tip, HEAD^2 the PR head.
          if [ "${{ github.event_name }}" = "pull_request" ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            for c in $(git rev-list --no-merges HEAD^1..HEAD^2); do
              # Added lines only, tagged with their file; print the file names, never the matched text.
              files=$(git show --no-color --format= --unified=0 "$c" \
                | awk '/^\+\+\+ /{f=substr($0,5); sub(/^b\//,"",f); next} /^\+/{print f "\t" substr($0,2)}' \
                | grep -F -f "$deny" | cut -f1 | sort -u || true)
              if [ -n "$files" ]; then
                echo "Commit $(git rev-parse --short "$c") adds a denylisted value in:"
                echo "$files" | sed 's/^/  /'
                fail=1; history=1
              fi
              # Merge commits carry each commit's message onto main too.
              if git log -1 --format=%B "$c" | grep -q -F -f "$deny"; then
                echo "Commit $(git rev-parse --short "$c") has a denylisted value in its message"
                fail=1; history=1
              fi
            done
            if [ "${history:-0}" = 1 ]; then
              echo
              echo "Removing the value in a later commit is not enough: the commit above still carries it, and"
              echo "merging the PR would put it on main. Rewrite the branch so no commit ever adds it (for example"
              echo "git rebase -i origin/main and fold the fix into that commit, or reword its message, or squash"
              echo "the branch to one commit), then force-push. Don't paste the value anywhere while fixing it."
            fi
          fi
          if [ "$fail" = 1 ]; then exit 1; fi
          echo "No denylisted values in the tree or in this PR's commits."

  web:
    name: web
    needs: changes
    # Skip on tag pushes — the retag job aliases an already-tested
    # main-built image, so the SPA bundle / Go vet / Go test results
    # would just repeat themselves. PRs + main pushes + workflow_dispatch
    # still run.
    if: "!startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.web == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Type-check web
        working-directory: web
        run: npx tsc --noEmit

      # Lint is intentionally separate from typecheck — typecheck
      # has historically passed even when a Rules of Hooks violation
      # blanked the page on hard refresh. ESLint with
      # react-hooks/rules-of-hooks catches that class of bug at CI
      # time so the next regression fails the build, not the user.
      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Test web
        working-directory: web
        run: npm run test:run

      - name: Build web
        working-directory: web
        run: npm run build

  # The Helm chart: chart-testing lint (yamllint, Chart.yaml schema and, on PRs, a
  # version bump for any chart change), helm lint --strict and a render of every
  # deploy/helm/rivolt/ci/*-values.yaml case (defaults, CNPG, existingSecret,
  # prod-like) through kubeconform -strict, with CRD schemas (CNPG,
  # Prometheus operator) from the datree catalog. A render with no KEK must
  # fail, as the chart promises. PRs that touch deploy/helm (or .github) only.
  chart:
    name: chart
    needs: changes
    if: "!startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.chart == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHART: deploy/helm/rivolt
      KUBE_VERSION: "1.35.0"
      # Bump each version with its tarball's sha256 (from the release's
      # checksums file). ct's Python linters: .github/ct-requirements.txt.
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      CT_VERSION: 3.15.0
      CT_SHA256: 467561730f25fe09d5e6cd09a3e1f6aa759871c657a57602947c716d9be2c583
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # ct compares with origin/main

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1

      # chart-testing and kubeconform from their releases, checked against
      # pinned sha256s (helm/chart-testing-action failed in its own cosign
      # step), with ct's Python linters hash-pinned in a venv.
      - name: Install ct and kubeconform
        run: |
          cd "$RUNNER_TEMP"
          ct="https://github.com/helm/chart-testing/releases/download/v${CT_VERSION}"
          curl -fsSLO "$ct/chart-testing_${CT_VERSION}_linux_amd64.tar.gz"
          echo "${CT_SHA256}  chart-testing_${CT_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          mkdir ct && tar xzf "chart-testing_${CT_VERSION}_linux_amd64.tar.gz" -C ct
          kc="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "$kc/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          python3 -m venv venv
          venv/bin/pip install --quiet --require-hashes --only-binary :all: -r "$GITHUB_WORKSPACE/.github/ct-requirements.txt"
          { echo "$RUNNER_TEMP"; echo "$RUNNER_TEMP/ct"; echo "$RUNNER_TEMP/venv/bin"; } >> "$GITHUB_PATH"

      - name: ct lint
        run: |
          # PRs: the charts changed against main, which must bump their version.
          # Pushes: nothing differs from main, so lint every chart, no bump check.
          extra=""
          [ "${{ github.event_name }}" = "pull_request" ] || extra="--all --check-version-increment=false"
          ct lint --config .github/ct.yaml \
            --lint-conf "$RUNNER_TEMP/ct/etc/lintconf.yaml" --chart-yaml-schema "$RUNNER_TEMP/ct/etc/chart_schema.yaml" $extra

      - name: helm lint --strict and kubeconform, per values case
        run: |
          set -o pipefail
          for f in "$CHART"/ci/*-values.yaml; do
            echo "::group::$(basename "$f")"
            helm lint --strict "$CHART" -f "$f"
            helm template rivolt "$CHART" -f "$f" \
              | kubeconform -strict -summary -kubernetes-version "$KUBE_VERSION" \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

      # The migrate Job's pod must never match the Service's (or the PDB's,
      # or the Deployment's) selector: with no readiness probe it would count
      # as Ready and receive traffic (migrations-job design, architect).
      - name: Migrate Job pods are no Service endpoint
        run: |
          set -o pipefail
          out=$(helm template rivolt "$CHART" -f "$CHART/ci/migrate-job-values.yaml")
          labels=$(echo "$out" | yq 'select(.kind == "Job") | .spec.template.metadata.labels')
          [ -n "$labels" ] && [ "$labels" != "null" ] || { echo "::error::no migrate Job rendered"; exit 1; }
          for kind in Service PodDisruptionBudget Deployment; do
            sel=$(echo "$out" | yq "select(.kind == \"$kind\") | (.spec.selector.matchLabels // .spec.selector) | to_entries | .[] | .key + \"=\" + .value")
            [ -n "$sel" ] || continue
            all=1
            while IFS= read -r kv; do
              k=${kv%%=*}; v=${kv#*=}
              [ "$(echo "$labels" | yq ".[\"$k\"] // \"\"")" = "$v" ] || all=0
            done <<< "$sel"
            if [ "$all" = 1 ]; then echo "::error::the migrate Job's pod matches the $kind selector"; exit 1; fi
            echo "$kind selector: not matched by the migrate Job's pod"
          done
          # The grant roles reach the migrator; nothing else from config.extraEnv does.
          env=$(echo "$out" | yq 'select(.kind == "Job") | .spec.template.spec.containers[0].env[].name')
          for want in RIVOLT_APP_ROLE RIVOLT_READONLY_ROLE; do
            echo "$env" | grep -qx "$want" || { echo "::error::the migrate Job lacks $want"; exit 1; }
          done
          if echo "$env" | grep -qx RIVOLT_OIDC_GOOGLE_DISPLAY_NAME; then echo "::error::config.extraEnv leaked into the migrate Job"; exit 1; fi
          echo "migrate Job env: the grant roles, and nothing else from config.extraEnv"
          # A plain wave-0 resource, not a hook: Argo recreates a hook with no delete policy on
          # every sync and retry. IgnoreExtraneous keeps a superseded Job from making the app
          # OutOfSync, and a TTL removes it.
          job=$(echo "$out" | yq 'select(.kind == "Job")')
          [ "$(echo "$job" | yq '.metadata.annotations["argocd.argoproj.io/hook"] // ""')" = "" ] \
            || { echo "::error::the migrate Job is an Argo hook again"; exit 1; }
          [ "$(echo "$job" | yq '.metadata.annotations["argocd.argoproj.io/sync-wave"]')" = "0" ] \
            || { echo "::error::the migrate Job isn't at sync wave 0"; exit 1; }
          echo "$job" | yq '.metadata.annotations["argocd.argoproj.io/compare-options"]' | grep -q IgnoreExtraneous \
            || { echo "::error::the migrate Job lacks compare-options IgnoreExtraneous"; exit 1; }
          [ "$(echo "$job" | yq '.spec.ttlSecondsAfterFinished // 0')" -gt 0 ] \
            || { echo "::error::the migrate Job has no ttlSecondsAfterFinished"; exit 1; }
          echo "migrate Job: wave-0 resource, not a hook, IgnoreExtraneous, TTL set"
          # The Job's name is per release and spec (so it runs once per new image or spec): stable
          # for the same input, new when the spec changes, a DNS-1123 subdomain of at most 63
          # characters even for a long tag.
          name() { helm template rivolt "$CHART" -f "$CHART/ci/migrate-job-values.yaml" "$@" | yq 'select(.kind == "Job") | .metadata.name'; }
          a=$(name); b=$(name); c=$(name --set migrate.job.backoffLimit=2)
          long=$(name --set image.tag=v0.40.0-dev.14+sha-96e8eda.a-very-long-build-suffix-for-the-length-cap)
          [ -n "$a" ] && [ "$a" = "$b" ] || { echo "::error::migrate Job name isn't stable: $a / $b"; exit 1; }
          [ "$a" != "$c" ] || { echo "::error::migrate Job name didn't change with its spec"; exit 1; }
          for n in "$a" "$long"; do
            [ "${#n}" -le 63 ] && echo "$n" | grep -Eq '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$' \
              || { echo "::error::invalid migrate Job name: $n"; exit 1; }
          done
          echo "migrate Job name: $a (stable, per spec, valid; long tags capped: ${#long} chars)"

      - name: No KEK, no render
        run: |
          if out=$(helm template rivolt "$CHART" --set externalDatabase.host=db.invalid 2>&1); then
            echo "::error::the chart rendered without secrets.kek or secrets.existingSecret"; exit 1
          fi
          echo "$out" | grep -q 'rivolt: set secrets.kek' || { echo "$out"; echo "::error::unexpected failure"; exit 1; }

  # Functional Playwright specs (all of them, with the new look), against `vite preview` and the stub
  # API (web/e2e/stub.ts): no backend, no real data. PRs that touch web only.
  # The visual-regression spec stays opt-in (E2E_VISUAL): its baselines carry
  # the OS and do not match Linux. Three shards in parallel; each builds the SPA
  # itself so the shards never wait on each other. Not a required check yet.
  e2e:
    name: e2e (${{ matrix.suite }} ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: changes
    # PRs run chromium; main pushes and a manual run run WebKit (below).
    if: "needs.changes.outputs.web == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))"
    runs-on: ubuntu-latest
    # WebKit runs in Playwright's own image: its system libraries are not on the runner,
    # and installing them with apt from the runner's mirror stalled 350 to 500 s on some
    # runs. The image carries the libraries and the browser build for this Playwright
    # version. Pinned by digest of the multi-arch index (v1.64.1-noble, built Oct 14);
    # bump the tag and digest with playwright-core (the step below fails on a mismatch).
    container: ${{ matrix.project == 'webkit' && 'mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf' || null }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One suite: every spec, with the new look (the only one users get).
        # PRs: chromium, three shards. Main pushes and a manual run: WebKit (the iPhone
        # Safari engine; the phone specs only, see web/playwright.config.ts), two shards.
        # Both are balanced by each spec's test time from main's newest runs
        # (web/scripts/e2e-shard.mjs; e2e-report and the nightly run save the timings). WebKit left the PR
        # path for speed (the owner, Oct 23); keep it on main: a WebKit failure turns
        # that main build red, tag-validate refuses a tag whose SHA has no green main
        # build, bump-preview waits for e2e-ok (so preview only gets SHAs that can be
        # tagged), and e2e-report opens the "e2e red on main" issue. A Safari
        # regression can land on main but can't reach preview or ship. publish does not
        # wait for it (it only pushes per-commit image tags). Also nightly
        # (e2e-nightly.yml) and the pre-release iPhone WebKit gate at tag.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"suite":"all","project":"chromium","shard":1,"total":3},{"suite":"all","project":"chromium","shard":2,"total":3},{"suite":"all","project":"chromium","shard":3,"total":3}]' || '[{"suite":"all","project":"webkit","shard":1,"total":2},{"suite":"all","project":"webkit","shard":2,"total":2}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund

      # The browser cache is keyed on Playwright's own version (the lockfile entry for
      # playwright-core), not on the whole lockfile: any unrelated dependency bump
      # changed the lockfile hash, missed the cache and sent every shard to download
      # Chromium (280 to 630 s a shard, against 90 to 190 s of tests).
      - name: Playwright version
        id: pw-ver
        working-directory: web
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      # The browser download is the slow part. The cache is saved only by the
      # main-only `playwright-cache` job below (a PR's own cache is readable
      # only from that PR, so per-PR copies never hit and filled the repo's
      # Actions budget); PRs just restore main's. System libraries are not in
      # the cache: web/scripts/pw-system-deps.sh installs them only when the
      # browser's binary reports a missing one (apt from a slow mirror took up
      # to 10 minutes of a shard that runs 2-3 minutes of tests).
      - name: The WebKit image matches Playwright
        if: matrix.project == 'webkit'
        env:
          VERSION: ${{ steps.pw-ver.outputs.version }}
        run: |
          # The image's tag is the Playwright version it was built for; a different
          # playwright-core would look for a browser build the image does not have.
          if [ "$VERSION" != "1.64.1" ]; then
            echo "::error::playwright-core is $VERSION but the webkit image is v1.64.1: bump the container tag and digest"
            exit 1
          fi

      - name: Restore Playwright browsers
        id: pw-cache
        if: matrix.project != 'webkit'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ steps.pw-ver.outputs.version }}

      - name: Install Playwright browser
        if: matrix.project != 'webkit'
        working-directory: web
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install ${{ matrix.project }}
          fi
          ./scripts/pw-system-deps.sh ${{ matrix.project }}

      - name: Build web
        working-directory: web
        run: npm run build

      # Per-spec test seconds for this browser from main's newest run (saved by e2e-report on main pushes
      # and by the nightly run), so the split follows the suite as it is. Missing: the committed snapshot.
      - name: Restore spec timings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/e2e-timings
          key: e2e-timings-${{ matrix.project }}-none
          restore-keys: e2e-timings-${{ matrix.project }}-

      - name: Playwright (${{ matrix.suite }}, ${{ matrix.project }})
        working-directory: web
        env:
          CI: "true"
          E2E_WEBKIT: "1"
          E2E_PROJECT: ${{ matrix.project }}
          E2E_TIMINGS: e2e-timings/${{ matrix.project }}.json
        run: |
          # Balanced by duration: this shard's spec files (scripts/e2e-shard.mjs). A WebKit shard can hold specs
          # with no phone test, hence --pass-with-no-tests there (only: a chromium shard that runs nothing still
          # fails); --check fails unless every spec is in one shard.
          node scripts/e2e-shard.mjs --check ${{ matrix.total }}
          npx playwright test $(node scripts/e2e-shard.mjs ${{ matrix.shard }} ${{ matrix.total }}) --project=${{ matrix.project }} ${{ matrix.project == 'webkit' && '--pass-with-no-tests' || '' }}

      - name: Summary (flaky tests)
        if: always()
        working-directory: web
        run: node scripts/e2e-timings.mjs summary e2e-results/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-results-${{ matrix.project }}-${{ matrix.shard }}
          path: web/e2e-results/results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-${{ matrix.suite }}-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/e2e/__screenshots__
            web/e2e/__results__
          if-no-files-found: ignore
          retention-days: 7

  # Keeps main's Playwright browser cache current for the e2e job's PRs. Only
  # does work when the lockfile (the Playwright version) changed.
  playwright-cache:
    name: playwright-cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true   # a warm-up must never turn main red
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]   # WebKit runs in the Playwright image (see the e2e job)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund

      # Same key as the e2e job's restore: the browser cache is keyed on Playwright's own version (the lockfile entry for
      # playwright-core), not on the whole lockfile: any unrelated dependency bump
      # changed the lockfile hash, missed the cache and sent every shard to download
      # Chromium (280 to 630 s a shard, against 90 to 190 s of tests).
      - name: Playwright version
        id: pw-ver
        working-directory: web
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ steps.pw-ver.outputs.version }}

      - name: Download the browser on a miss (saved by the cache post step)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install ${{ matrix.project }}

  # The single required check for the e2e matrix. A matrix job skipped by its
  # job-level `if` reports under the unexpanded template name, so requiring
  # "e2e (chromium 1/3)" would never report on a backend-only PR. This one always
  # runs: green when the matrix passed or was skipped, red otherwise.
  # !cancelled(), not always(): an always() job still runs in a run that
  # concurrency cancelled (a newer push to the PR), and with `changes`
  # cancelled it went red. That red check stays on the same head SHA next to
  # the newer run's green one, and Renovate's automerge reads the branch as
  # failing (#39 sat unmerged). A cancelled run now leaves e2e-ok skipped.
  e2e-ok:
    name: e2e-ok
    needs: [changes, e2e]
    if: "!cancelled() && !startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Matrix result
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES, e2e: $RESULT"
          # A failed `changes` skips e2e; that must not read as green.
          [ "$CHANGES" = "success" ] || exit 1
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  # A failed WebKit shard on main (a push, or a manual run on main) opens or
  # comments on the "e2e red on main" issue, as the nightly run does; the next
  # green main run says so once. Tests that passed only on a retry go to the
  # "e2e flaky on main" issue. Shared with e2e-nightly.yml. It also saves this
  # run's per-spec WebKit timings for the next runs' shard split.
  e2e-report:
    name: e2e-report
    needs: e2e
    if: "!cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.e2e.result == 'success' || needs.e2e.result == 'failure')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # an issue-tracker blip must never turn main red
    permissions:
      contents: read   # checks out .github/scripts and web/scripts
      actions: read    # reads the run's jobs
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      KIND: ${{ github.event_name == 'push' && 'main push (WebKit)' || 'manual run on main (WebKit)' }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ARTIFACTS: e2e-all-webkit-*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/scripts
            web/scripts
            web/e2e

      - name: Open, update or clear the issue
        env:
          RESULT: ${{ needs.e2e.result }}
          TITLE: e2e red on main
        run: bash .github/scripts/e2e-red-issue.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-results-webkit-*
          path: results

      - name: Flaky tests and timings
        id: merge
        run: |
          reports=$(ls results/*/results.json 2>/dev/null || true)
          flaky=$(node web/scripts/e2e-timings.mjs flaky $reports)
          RESULT=flaky TITLE="e2e flaky on main" FLAKY="$flaky" bash .github/scripts/e2e-red-issue.sh
          mkdir -p web/e2e-timings
          # Both shards' reports, or nothing (a missing shard would read as zeros).
          node web/scripts/e2e-timings.mjs merge web/e2e-timings/webkit.json 2 $reports
          [ -f web/e2e-timings/webkit.json ] && echo "save=true" >> "$GITHUB_OUTPUT" || true

      - name: Save the WebKit timings for the next runs
        if: steps.merge.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/e2e-timings
          key: e2e-timings-webkit-${{ github.run_id }}

  go:
    name: go
    needs: changes
    if: "!startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.go == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      # Two caches, kept apart (measured Oct 23: one run of this job builds a 1.9 GB build cache, but the single
      # cache restored here had grown to 13 GB uncompressed by carrying every day's objects forward through
      # restore-keys: 183 s to restore for 76 s of work, against 319 s for the same work with no cache).
      #
      # The module download cache is keyed on go.sum alone and saved from main when it misses (a cold
      # `go mod download` is 14 s, but a dropped connection to proxy.golang.org used to fail the job).
      #
      # The build cache is keyed on the Go version and the UTC day. Only a main push saves it, and only when
      # the day's key is missing, from a run that restored NOTHING (exact key, no restore-keys), so a day's
      # cache holds one build and cannot grow. PRs read it, falling back to yesterday's entry until the
      # day's first main push; they never save (a PR's own cache is readable only by that PR). A day, not a
      # week: a weekly cache went stale within the week (go test 67 s to 87 s in one day as the code moved
      # away from it); the cost is that the day's first main push builds cold.
      - name: Cache keys
        id: ck
        run: |
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "prev=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          echo "gover=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Restore Go module download cache
        id: gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod/cache/download
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Restore Go build cache
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-unit-${{ runner.os }}-${{ steps.ck.outputs.gover }}-${{ steps.ck.outputs.day }}
          restore-keys: ${{ github.event_name == 'push' && 'no-fallback-on-push-' || format('go-unit-{0}-{1}-{2}', runner.os, steps.ck.outputs.gover, steps.ck.outputs.prev) }}

      # Satisfy `//go:embed all:dist` without running the vite build.
      # Assets() returns nil at runtime when index.html is absent, so
      # the stub is safe for vet/test.
      - name: Stub web assets for embed
        run: |
          mkdir -p internal/web/dist
          touch internal/web/dist/.keep

      # -race because the data plane is goroutine-heavy (lease
      # coordinator, per-user monitors, atomic reauth state); the
      # detector turns latent races into hard failures here instead
      # of heisenbugs in prod.
      # vet runs alongside the tests instead of before them; both
      # must pass.
      - name: go vet + go test
        run: |
          go vet ./... > vet.log 2>&1 & vet=$!
          go test -race ./...; t=$?
          wait $vet; v=$?
          cat vet.log
          exit $(( t != 0 || v != 0 ))

      - name: Save Go module download cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gomod.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod/cache/download
          key: ${{ steps.gomod.outputs.cache-primary-key }}

      - name: Save Go build cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  # golangci-lint (config: .golangci.yml, the standard set), as its own job so it
  # runs beside `go` and adds nothing to the critical path, and so a lint finding
  # never hides test results. NOT a required check until it has stayed green; main
  # is at 0 issues. The linter version is pinned here (never `latest`); Renovate
  # bumps it through the annotation below (preset customManagers:githubActionsVersions)
  # and the action through its digest.
  lint:
    name: lint
    needs: changes
    if: "!startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.go == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=golangci/golangci-lint
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      # Restore only (this job never saves a Go cache; see the go job for how they are keyed and saved): the
      # module download cache, and the integration job's build cache. The linter type-checks from compiled
      # dependencies, which cost 90 s to build cold and 22 s of linting once they exist, and the integration
      # cache holds exactly those (plain, non-race objects, 178 MB). The go-unit cache holds -race objects a
      # type-check never reuses; restoring it was 118 s of this job's 162 s. Misses fall back to building.
      - name: Cache keys
        id: ck
        run: |
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "prev=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          echo "gover=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Restore Go module download cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod/cache/download
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Restore Go build cache (the integration job's)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-integration-${{ runner.os }}-${{ steps.ck.outputs.gover }}-${{ steps.ck.outputs.day }}
          restore-keys: go-integration-${{ runner.os }}-${{ steps.ck.outputs.gover }}-${{ steps.ck.outputs.prev }}

      # Satisfy `//go:embed all:dist` without running the vite build (as in `go`).
      - name: Stub web assets for embed
        run: |
          mkdir -p internal/web/dist
          touch internal/web/dist/.keep

      # The action restores the linter's own analysis cache. Only main saves it (a PR's copy is readable by that
      # PR alone and filled the repo's Actions budget).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout 5m
          skip-save-cache: ${{ github.ref != 'refs/heads/main' }}

  integration:
    name: integration
    needs: changes
    if: "!startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.go == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub-hosted ubuntu runners ship Docker, which testcontainers-go
    # talks to over the default unix socket — no extra service: block
    # needed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      # The same two caches as the go job (see the comment there), the build cache under its own prefix because
      # these objects are compiled without -race and with the integration tag.
      - name: Cache keys
        id: ck
        run: |
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "prev=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          echo "gover=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Restore Go module download cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod/cache/download
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Restore Go build cache
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-integration-${{ runner.os }}-${{ steps.ck.outputs.gover }}-${{ steps.ck.outputs.day }}
          restore-keys: ${{ github.event_name == 'push' && 'no-fallback-on-push-' || format('go-integration-{0}-{1}-{2}', runner.os, steps.ck.outputs.gover, steps.ck.outputs.prev) }}

      # Pre-pull so the testcontainers run-time isn't dominated by the
      # postgres image fetch. ~80MB, cached across runs by docker.
      - name: Pull postgres image
        run: docker pull postgres:16-alpine

      # The Hydra the sign-out/revoke test runs against (internal/integration/hydra_remember_test.go).
      - name: Pull hydra image
        run: docker pull oryd/hydra:v2.3.0

      - name: go test (integration)
        # Every package with an integration-tagged test runs, found from
        # the build tag rather than a hand-kept list: the list missed
        # appauth, push, sessions, demo and rivian, so their Postgres
        # tests never ran in CI (found on #789, 2026-10-21). The listing
        # is printed so the log shows what ran.
        run: |
          pkgs=$(grep -rl --include='*_test.go' '^//go:build integration' internal cmd 2>/dev/null | xargs -n1 dirname | sort -u | sed 's#^#./#')
          [ -n "$pkgs" ] || { echo "no integration packages found" >&2; exit 1; }
          echo "integration packages:"; echo "$pkgs"
          # RIVOLT_TEST_REQUEST_POOL: the api tests that build a router or a handler run on a real request pool (a rivolt_app
          # style role under the tenant policies), the way the server runs with row-level security on. See poolOn.
          RIVOLT_TEST_REQUEST_POOL=1 go test -tags=integration -count=1 -timeout=10m $pkgs

      - name: go test (integration, request pool off)
        # The self-hosted shape, where RIVOLT_REQUEST_DATABASE_URL is never set and everything runs on the one owner pool. A small
        # run is enough to keep that fallback from rotting; the full suite above runs with the pool on.
        run: go test -tags=integration -count=1 -timeout=5m -run 'TestSelfDelete_|TestAppBearerThroughTheRouter|TestAccountUnits|TestBackupRestoreRoundTrip|TestBackupStreamsWithBoundedMemory' ./internal/api

      - name: Save Go build cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  # Keeps the repo's Actions cache from filling up. The Go caches are saved once a UTC
  # day under a new key (so the build cache is refreshed), and the old day's entry
  # stayed until GitHub evicted it for space: two ~3.9 GB + ~2.3 GB generations
  # never fit in the 10 GB limit with the image layers and the Playwright browsers,
  # so every daily refresh evicted something people were still using (a miss on
  # publish's image layers or the browser cache cost minutes). After main's Go jobs
  # have saved, keep only the newest entry of each Go cache and of each Playwright
  # browser (a Playwright bump leaves the old version's entry behind too).
  # Its own job so the actions:write token never reaches the jobs that run PR code.
  # Main pushes only; a failure here never turns main red.
  cache-prune:
    name: cache-prune
    needs: [go, integration]
    if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.go.result == 'success' && needs.integration.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Keep the newest cache of each kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in go-unit-Linux- go-integration-Linux- go-image-Linux- gomod-Linux- playwright-Linux-chromium- playwright-Linux-webkit- e2e-timings-chromium- e2e-timings-webkit-; do
            ids=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$prefix" --sort created_at --order desc --limit 100 --json id,key,sizeInBytes \
              | jq -r '.[1:][] | "\(.id) \(.key) \(.sizeInBytes)"')
            kept=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$prefix" --sort created_at --order desc --limit 1 --json key -q '.[0].key')
            echo "$prefix keeps $kept"
            echo "$ids" | while read -r id key size; do
              [ -n "$id" ] || continue
              echo "  deleting $key ($((size / 1048576)) MB)"
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
            done
          done

  # The image is assembled from prebuilt outputs instead of compiling inside BuildKit (where the cache mounts do not
  # persist on a runner, so every main push re-ran npm ci, the vite build and a cold Go build: 130 to 145 s on the
  # release path). `bin` builds the SPA and the static binary on the runner, with a warm Go cache and the same flags
  # as the root Dockerfile; `image` copies the binary onto distroless (.github/ci/Dockerfile) and checks the result is
  # the image the root Dockerfile makes; `publish` pushes the same assembly once the tests pass. The root
  # Dockerfile is unchanged (self-hosters, local builds, and `platforms` other than linux/amd64 still use it).
  bin:
    name: bin
    # No needs: it starts with the first jobs, beside the tests.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
      devtag: ${{ steps.ver.outputs.devtag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # fetch-tags so the version stamp below can read the prior
          # release with `git describe`.
          fetch-tags: true
          fetch-depth: 0

      # Compose a human-legible VERSION stamp for the binary. On main:
      # "<last-release-tag>+sha-<short>" so the SPA footer can show
      # "v0.19.13+sha-6001e6a" instead of an opaque hash. Tag pushes
      # take the retag path (separate job below) and don't reach here.
      - name: Compute VERSION stamp
        id: ver
        # Semver pre-release for builds that aren't a release, so preview
        # versions sort and read in order: main → next minor (v0.33.2 + 15
        # commits = v0.34.0-dev.15), release/** → next patch
        # (v0.33.3-dev.N). N = commits since the last tag, monotonic on a
        # branch. The sha stays as build metadata; images also get the
        # dev tag (no "+", which Docker tags don't allow).
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
          n=$(git rev-list --count "${last_tag}..HEAD" 2>/dev/null || echo 0)
          IFS=. read -r ma mi pa <<< "${last_tag#v}"
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then next="${ma}.${mi}.$((pa+1))"; else next="${ma}.$((mi+1)).0"; fi
          short="sha-${GITHUB_SHA:0:7}"
          echo "version=v${next}-dev.${n}+${short}" >> "$GITHUB_OUTPUT"
          echo "devtag=${next}-dev.${n}" >> "$GITHUB_OUTPUT"
          echo "VERSION v${next}-dev.${n}+${short}"

      # The SPA, built the way the Dockerfile's web stage does (vite writes to internal/web/dist, which the binary embeds).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the SPA
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      # Caches as in the go job (see there): the module download cache, and a build cache of this job's own (objects
      # for CGO_ENABLED=0, which the test caches do not hold) keyed on the Go version and UTC day, saved by a main
      # push from a run that restored nothing.
      - name: Cache keys
        id: ck
        run: |
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "prev=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          echo "gover=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Restore Go module download cache
        id: gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod/cache/download
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Restore Go build cache
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-image-${{ runner.os }}-${{ steps.ck.outputs.gover }}-${{ steps.ck.outputs.day }}
          restore-keys: ${{ github.event_name == 'push' && 'no-fallback-on-push-' || format('go-image-{0}-{1}-{2}', runner.os, steps.ck.outputs.gover, steps.ck.outputs.prev) }}

      # The same command as the Dockerfile's build stage (CGO off, -trimpath, stripped, version stamped).
      - name: Build the binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p image-ctx/data
          chmod 0755 image-ctx/data
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o image-ctx/rivolt ./cmd/rivolt
          chmod 0755 image-ctx/rivolt
          ls -l image-ctx/rivolt
          # The binary must be what the Dockerfile builds: static, trimpath'd, and stamped with this version.
          info=$(go version -m image-ctx/rivolt)
          echo "$info" | grep -E 'CGO_ENABLED|trimpath|ldflags|GOARCH|GOOS'
          echo "$info" | grep -q 'CGO_ENABLED=0' || { echo "::error::binary is not CGO_ENABLED=0"; exit 1; }
          echo "$info" | grep -q -- '-trimpath=true' || { echo "::error::binary is not -trimpath"; exit 1; }
          # (-trimpath leaves -ldflags out of the build info, so look for the stamped string itself.)
          grep -aqF -- "${VERSION}" image-ctx/rivolt || { echo "::error::binary is not stamped ${VERSION}"; exit 1; }

      # tar keeps the modes the upload would drop.
      - name: Pack the image context
        run: tar -C image-ctx -cf image-ctx.tar rivolt data

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-ctx
          path: image-ctx.tar
          retention-days: 1

      - name: Save Go module download cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gomod.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod/cache/download
          key: ${{ steps.gomod.outputs.cache-primary-key }}

      - name: Save Go build cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  image:
    name: image
    # Assembles the image from `bin`'s binary, without pushing or tagging anything (no registry login here), and
    # checks it matches what the root Dockerfile builds. publish pushes the same assembly once the tests pass.
    needs: bin
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ needs.bin.outputs.version }}
      devtag: ${{ needs.bin.outputs.devtag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-ctx

      - name: Unpack the image context
        run: mkdir image-ctx && tar -C image-ctx -xf image-ctx.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: image-ctx
          file: .github/ci/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: rivolt-ci:check

      # The image must be what the root Dockerfile makes: same user, port, environment, volume, entrypoint,
      # working directory, binary mode and /data owner (the binary itself is checked in `bin`).
      - name: Check the image
        run: |
          set -euo pipefail
          cfg=$(docker inspect rivolt-ci:check --format '{{json .Config}}')
          echo "$cfg" | jq -e '.User == "nonroot:nonroot" and .WorkingDir == "/app" and (.Entrypoint == ["/app/rivolt"])
            and (.ExposedPorts | keys == ["8080/tcp"]) and (.Volumes | keys == ["/data"]) and (.Env | index("DATA_DIR=/data") != null)' >/dev/null \
            || { echo "::error::image config differs from the root Dockerfile's: $cfg"; exit 1; }
          cid=$(docker create rivolt-ci:check)
          docker export "$cid" | tar -tvf - app/rivolt data/ | tee listing.txt
          grep -qE '^-rwxr-xr-x 0/0 .* app/rivolt$' listing.txt || { echo "::error::/app/rivolt is not root:root 0755"; exit 1; }
          grep -qE '^drwxr-xr-x 65532/65532 .* data/$' listing.txt || { echo "::error::/data is not owned by 65532:65532"; exit 1; }
          docker rm "$cid" >/dev/null

  publish:
    name: publish
    # Only a commit whose tests passed gets an image. Building in parallel
    # pushed sha-<short> for red commits too, and bump-preview only waited
    # for the tests when a migration was in range, so a red commit could
    # reach preview. (tag-validate still requires a fully green run for
    # prod.) needs: skips publish, and with it bump-preview, when any of
    # these fail. The binary was built in `bin` and the image assembled and
    # checked in `image`; this assembles the same image again and pushes it.
    needs: [image, go, integration, web]
    outputs:
      version: ${{ needs.image.outputs.version }}
    # Build & push the image. Main pushes and workflow_dispatch only;
    # tag pushes take the retag-only path below (skipping tests, since
    # the code already shipped to preview).
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # reserved for future cosign signing
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}  # e.g. apohor/rivolt
    steps:
      # Shallow: the version stamp comes from the bin job. A platforms choice other than linux/amd64 (a manual run)
      # builds the root Dockerfile instead, which needs the whole tree.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: ${{ (github.event.inputs.platforms || 'linux/amd64') == 'linux/amd64' && '.github/ci' || '' }}

      - name: Fetch the prebuilt image context
        if: (github.event.inputs.platforms || 'linux/amd64') == 'linux/amd64'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-ctx

      - name: Unpack the image context
        if: (github.event.inputs.platforms || 'linux/amd64') == 'linux/amd64'
        run: mkdir image-ctx && tar -C image-ctx -xf image-ctx.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag set: this job only runs on main pushes + workflow_dispatch.
          # workflow_dispatch on a tag ref still gets the semver shape.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
            type=raw,value=${{ needs.image.outputs.devtag }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}

      # Only copies the prebuilt binary onto distroless (see `bin` and `image`), so this is seconds.
      - name: Build & push
        if: (github.event.inputs.platforms || 'linux/amd64') == 'linux/amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: image-ctx
          file: .github/ci/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The rare multi-arch run: the root Dockerfile, compiled inside BuildKit.
      - name: Build & push (root Dockerfile, other platforms)
        if: (github.event.inputs.platforms || 'linux/amd64') != 'linux/amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ needs.image.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  bump-preview:
    name: bump-preview
    # Preview gets only a SHA that tag-validate would accept: every job that can
    # turn this run red is needed here (publish already needs go, integration and
    # web; e2e-ok is the WebKit run on main, lint and chart run on every push).
    # Otherwise a WebKit flake or a lint failure on main shipped to preview and
    # left that SHA untaggable for prod. The housekeeping jobs (cache-prune,
    # playwright-cache, e2e-report) are continue-on-error and can't redden it.
    # e2e-ok finished about 35 s after publish on the first 2-shard main run.
    needs: [publish, changes, e2e-ok, lint, chart]
    # Only after a successful main image publish (a push, or a manual run on
    # main) — tag pushes go to prod manually, not via this auto-bump.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No job-level concurrency: a pending job superseded in a concurrency
    # group is cancelled, which would mark that commit's run cancelled and
    # make tag-validate refuse it. Instead the step below retries on a
    # rejected push and re-checks newest-wins each attempt.
    permissions:
      contents: read
    steps:
      - name: Checkout rivolt-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: apohor/rivolt-infra
          # Fine-scoped PAT with contents:write on apohor/rivolt-infra.
          # The default GITHUB_TOKEN only has access to this repo.
          token: ${{ secrets.RIVOLT_INFRA_TOKEN }}

      - name: Bump preview image.tag (newest wins)
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION_STAMP: ${{ needs.publish.outputs.version }}
        run: |
          short="sha-${SHA:0:7}"
          file=apps/platform/rivolt-preview/values.yaml
          admin_file=apps/platform/rivolt-admin-preview/values.yaml
          git config user.name "rivolt-ci"
          git config user.email "ci@rivolt.dev"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            # Builds run in parallel, so an older commit's build can finish
            # after a newer one's: only move preview forward.
            prev=$(grep -E '^[[:space:]]+tag:[[:space:]]+sha-[0-9a-f]+' "$file" | head -1 | sed -E 's/.*sha-([0-9a-f]+).*/\1/')
            if [ -n "$prev" ]; then
              prev_full=$(gh api "repos/$REPO/commits/$prev" --jq .sha 2>/dev/null || true)
              rel=unknown
              [ -n "$prev_full" ] && rel=$(gh api "repos/$REPO/compare/$prev_full...$SHA" --jq .status 2>/dev/null || echo unknown)
              echo "preview runs ${prev}; this build ${SHA:0:7} is '${rel}' relative to it"
              case "$rel" in
                behind|identical) echo "preview already has this or newer; skipping."; exit 0 ;;
                # A migration in the range needs no extra wait: this job needs
                # publish, which needs go and integration, so a migration only
                # reaches preview's DB from a commit whose tests passed.
                ahead|diverged) ;;
                # An API blip must not roll preview back mid-QA; the next
                # merge's build bumps it. "diverged" (preview pinned by hand
                # off main) falls through to the old always-bump behaviour.
                unknown) echo "::warning::couldn't compare ${prev} with ${SHA:0:7}; not bumping."; exit 0 ;;
              esac
            fi
            # Rewrite `  tag: sha-xxxxxxx`, preserving indent. The preview
            # admin site (rivolt-admin-preview) moves with it in the same
            # commit: it shares preview's DB and migrates on boot, so it
            # must never run ahead of (or drift behind) preview.
            files=("$file")
            [ -f "$admin_file" ] && files+=("$admin_file")
            sed -i -E "s/^([[:space:]]+tag:)[[:space:]]+sha-[0-9a-f]+/\1 ${short}/" "${files[@]}"
            if git diff --quiet "${files[@]}"; then echo "image.tag unchanged; nothing to commit."; exit 0; fi
            git add "${files[@]}"
            git commit -q -m "rivolt-preview: bump image.tag to ${short} (${VERSION_STAMP})"
            if git push -q origin main; then echo "bumped to ${short}"; exit 0; fi
            echo "push rejected (another bump landed); retrying ($attempt)"
            sleep $((attempt * 3))
          done
          echo "::error::could not push the preview bump after 5 attempts"; exit 1

  tag-validate:
    name: tag-validate
    # Refuses tags pointing at a SHA that never had a successful main or
    # release/** push build. Without this, a tag at e.g. a docs-only commit
    # (CI skipped due to paths-filter) makes retag fail late with a
    # cryptic ImageManifestUnknown error. Fail fast with a clear
    # message instead.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Confirm SHA has a successful build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          # The tagged commit must have at least one successful build
          # workflow run targeting it. Tagging a docs-only commit (or
          # a commit before its main build finished) returns no rows.
          # A successful push build on main or on a release/** hotfix
          # branch both publish 'sha-<short>', so either qualifies. So
          # does a successful manual run on main: it runs the same jobs
          # (WebKit included) and bump-preview deploys it, and it is the
          # fix for a merge whose push event was dropped. Without it such
          # a SHA reached preview but could not be tagged.
          count=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow build.yml \
            --commit "$SHA" \
            --status success \
            --limit 20 \
            --json headBranch,event \
            --jq '[.[] | select((.event == "push" and (.headBranch == "main" or (.headBranch | startswith("release/")))) or (.event == "workflow_dispatch" and .headBranch == "main"))] | length')
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::Tag ${{ github.ref_name }} points at $SHA which has no successful main (push or manual) or release/** build."
            echo "::error::Tag a commit that's already been built (and ideally soaked on preview)."
            exit 1
          fi
          echo "OK: $SHA has a successful build run."

  retag:
    name: retag
    needs: tag-validate
    # Tag pushes attach prod tags to the existing main-built image. No
    # rebuild and no test re-run — the tag is a promotion signal, not
    # a new build. tag-validate has already confirmed the source SHA
    # built; the wait-for-image step below covers the case where the
    # main build is still in flight when the tag landed.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for sha-<short> on GHCR
        env:
          SHA: ${{ github.sha }}
          IMAGE: ghcr.io/${{ github.repository }}
        # Race guard: when a tag is pushed immediately after a main
        # commit, this job can start before the main build's publish
        # step has uploaded sha-<short>. Poll for up to 10 minutes
        # with a 10s cadence; fail loudly if the image truly never
        # appears (tag-validate should have caught that case earlier,
        # but defense in depth).
        run: |
          short="sha-${SHA:0:7}"
          for i in $(seq 1 60); do
            if docker buildx imagetools inspect "${IMAGE}:${short}" >/dev/null 2>&1; then
              echo "OK: ${IMAGE}:${short} is available (attempt ${i})."
              exit 0
            fi
            echo "attempt ${i}: ${short} not yet on GHCR, sleeping 10s…"
            sleep 10
          done
          echo "::error::${IMAGE}:${short} never appeared on GHCR after 10 minutes."
          exit 1

      - name: Retag sha-<short> → X.Y.Z / X.Y / latest
        env:
          VERSION: ${{ github.ref_name }}   # e.g. v0.19.13
          SHA: ${{ github.sha }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          short="sha-${SHA:0:7}"
          # Strip leading 'v' — GHCR tags are bare semver to match
          # docker/metadata-action's {{version}} output.
          v="${VERSION#v}"                  # 0.19.13
          minor="${v%.*}"                   # 0.19
          echo "Retagging ${IMAGE}:${short} → ${v} / ${minor} / latest"
          docker buildx imagetools create \
            --tag "${IMAGE}:${v}" \
            --tag "${IMAGE}:${minor}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${short}"

  bump-prod:
    name: bump-prod
    needs: retag
    # After retag attaches the prod tag to the existing image, rewrite
    # rivolt-infra's apps/platform/rivolt{,-admin}/{app.yaml,values.yaml} so ArgoCD picks
    # up the new version automatically. Removes the manual sed dance
    # that previously followed every tag push.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout rivolt-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: apohor/rivolt-infra
          token: ${{ secrets.RIVOLT_INFRA_TOKEN }}

      - name: Bump prod image.tag + chart.version
        env:
          VERSION: ${{ github.ref_name }}   # e.g. v0.22.3
        run: |
          set -e
          v="${VERSION#v}"                  # 0.22.3 — image tag uses bare semver
          app=apps/platform/rivolt/app.yaml
          values=apps/platform/rivolt/values.yaml
          # chart.version tracks the git tag literally (ArgoCD resolves
          # against the rivolt repo ref); image.tag is the bare semver
          # that the retag job applied on GHCR.
          # The admin site (rivolt-admin, admin.rivolt.dev) moves with prod
          # in the same commit: it shares prod's DB and migrates on boot, so
          # it must never run ahead of (or drift behind) prod.
          apps=("$app")
          vals=("$values")
          if [ -f apps/platform/rivolt-admin/app.yaml ]; then
            apps+=(apps/platform/rivolt-admin/app.yaml)
            vals+=(apps/platform/rivolt-admin/values.yaml)
          fi
          sed -i -E "s/^([[:space:]]+version:)[[:space:]]+v[0-9]+\.[0-9]+\.[0-9]+/\1 ${VERSION}/" "${apps[@]}"
          sed -i -E "s/^([[:space:]]+tag:)[[:space:]]+\"[0-9]+\.[0-9]+\.[0-9]+\"/\1 \"${v}\"/" "${vals[@]}"
          if git diff --quiet "${apps[@]}" "${vals[@]}"; then
            echo "prod already on ${VERSION} — nothing to commit."
            exit 0
          fi
          git config user.name "rivolt-ci"
          git config user.email "ci@rivolt.dev"
          git add "${apps[@]}" "${vals[@]}"
          git commit -m "rivolt: promote ${VERSION} to prod"
          git push origin main
