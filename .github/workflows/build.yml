# Build, test, and publish the rivolt container image.
#
# Triggers / outputs:
#   - Push to main        → tests + publish 'sha-<short>' & 'main' →
#                          auto-bump rivolt-infra preview values
#   - Push of vX.Y.Z tag  → tests + publish 'vX.Y.Z', 'X.Y', 'latest'
#                          (prod path; manual prod bump in rivolt-infra)
#   - Pull request        → tests only
#   - workflow_dispatch   → tests + publish (manual re-releases)
#
# Preview deploys continuously off main; prod stays pinned to whatever
# tag apps/rivolt/app.yaml in rivolt-infra points at.
name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/**"
      - "docker-compose*.yml"
      - "LICENSE"
      - ".editorconfig"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/**"
      - "docker-compose*.yml"
      - "LICENSE"
      - ".editorconfig"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma-separated) for the published image"
        required: false
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Type-check web
        working-directory: web
        run: npx tsc --noEmit

      # Lint is intentionally separate from typecheck — typecheck
      # has historically passed even when a Rules of Hooks violation
      # blanked the page on hard refresh. ESLint with
      # react-hooks/rules-of-hooks catches that class of bug at CI
      # time so the next regression fails the build, not the user.
      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Build web
        working-directory: web
        run: npm run build

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Satisfy `//go:embed all:dist` without running the vite build.
      # Assets() returns nil at runtime when index.html is absent, so
      # the stub is safe for vet/test.
      - name: Stub web assets for embed
        run: |
          mkdir -p internal/web/dist
          touch internal/web/dist/.keep

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  integration:
    name: integration
    runs-on: ubuntu-latest
    # GitHub-hosted ubuntu runners ship Docker, which testcontainers-go
    # talks to over the default unix socket — no extra service: block
    # needed.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pre-pull so the testcontainers run-time isn't dominated by the
      # postgres image fetch. ~80MB, cached across runs by docker.
      - name: Pull postgres image
        run: docker pull postgres:16-alpine

      - name: go test (integration)
        # Includes the per-store packages so the Postgres-driver bug
        # class (NULL scan, RawBytes, cross-tenant scoping) gets caught
        # in PR. internal/api/... covers the end-to-end isolation
        # contract over the real handlers.
        run: go test -tags=integration -count=1 -timeout=10m ./internal/integration/... ./internal/trips/... ./internal/drives/... ./internal/charges/... ./internal/signuprequests/... ./internal/leases/... ./internal/api/...

  publish:
    name: publish
    needs: [web, go, integration]
    # Publish on tags (prod) and main pushes (preview). PRs still skip.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # reserved for future cosign signing
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}  # e.g. apohor/rivolt
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # No QEMU needed: the Dockerfile runs web/go stages on $BUILDPLATFORM
      # and cross-compiles Go to linux/arm64 via GOOS/GOARCH. The runtime
      # stage is COPY-only, so arm64 images are produced without emulation.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag set is split by trigger:
          #   - vX.Y.Z tag push   → vX.Y.Z, X.Y, latest
          #   - main branch push  → sha-<7char>, main
          # workflow_dispatch picks up whichever subset matches its ref.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # amd64 is the DSM target and the only platform Rivolt is
          # currently deployed on. Multi-arch builds roughly double
          # the image stage time, so arm64 is opt-in via
          # workflow_dispatch (`platforms` input) for the rare
          # cases we need to publish both.
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          provenance: false
          # Stamp the semver derived by metadata-action into the Go
          # binary so /api/health and the Overview subtitle report it
          # (e.g. "Rivolt v0.1.0" on DSM instead of "Rivolt dev").
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-preview:
    name: bump-preview
    needs: publish
    # Only after a successful main-push image publish — tag pushes go to
    # prod manually, not via this auto-bump.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rivolt-infra
        uses: actions/checkout@v6
        with:
          repository: apohor/rivolt-infra
          # Fine-scoped PAT with contents:write on apohor/rivolt-infra.
          # The default GITHUB_TOKEN only has access to this repo.
          token: ${{ secrets.RIVOLT_INFRA_TOKEN }}

      - name: Bump preview image.tag
        env:
          SHA: ${{ github.sha }}
        run: |
          short="sha-${SHA:0:7}"
          file=apps/rivolt-preview/values.yaml
          # Rewrite `  tag: sha-xxxxxxx`, preserving indent.
          sed -i -E "s/^([[:space:]]+tag:)[[:space:]]+sha-[0-9a-f]+/\1 ${short}/" "$file"
          if git diff --quiet "$file"; then
            echo "image.tag unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "rivolt-ci"
          git config user.email "ci@rivolt.dev"
          git add "$file"
          git commit -m "rivolt-preview: bump image.tag to ${short}"
          git push origin main
