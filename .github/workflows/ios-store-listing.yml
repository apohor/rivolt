name: ios-store-listing

# GitOps for the App Store listing: applies ios/store/listing.md and ios/store/privacy-label.md to App Store Connect
# (version text, URLs, copyright, build, categories, content rights, age rating, US-only availability, free price,
# review details, screenshots, export compliance). By hand only, inside the `testflight` environment (the owner approves
# the run and only that environment holds the App Store Connect key). dry_run is on by default and writes nothing: it
# prints the planned changes, each call checked against Apple's OpenAPI spec. It never submits the version for review; that stays a separate, explicit action.
# App Privacy has no public API: both modes print the click list from privacy-label.md for the owner.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App Store version (the processed TestFlight build for it must exist)"
        required: true
        default: "1.4.3"
        type: string
      build_number:
        description: "Build number the ios-vX.Y.Z TestFlight run uploaded (its Version and build number step; 1.4.3 is 109)"
        required: true
        default: "109"
        type: string
      shots_run:
        description: "Run id of an ios-store-screenshots run on main (its two artifacts are the screenshots)"
        required: true
        type: string
      dry_run:
        description: "true prints the plan and writes nothing; false applies it"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-store-listing
  cancel-in-progress: false

jobs:
  listing:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the screenshots run, then fetch its artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.shots_run }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "shots_run must be a run id"; exit 1; }
          read -r name branch conclusion < <(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json workflowName,headBranch,conclusion \
            --jq '[.workflowName, .headBranch, .conclusion] | @tsv')
          echo "shots_run $RUN_ID: workflow=$name branch=$branch conclusion=$conclusion"
          [ "$name" = "ios-store-screenshots" ] && [ "$branch" = "main" ] && [ "$conclusion" = "success" ] \
            || { echo "shots_run must be a successful ios-store-screenshots run on main"; exit 1; }
          # Only the 6.9 inch set is uploaded (Apple's required size); the 6.3 inch shots stay in the run.
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "store-screenshots-6.9" -D "$RUNNER_TEMP/shots-6.9"
          mkdir -p "$RUNNER_TEMP/shots"
          cp -R "$RUNNER_TEMP/shots-6.9/store/6.9" "$RUNNER_TEMP/shots/6.9"

      - name: Download Apple's App Store Connect OpenAPI spec
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/spec.zip" https://developer.apple.com/sample-code/app-store-connect/app-store-connect-openapi-specification.zip
          unzip -q -o "$RUNNER_TEMP/spec.zip" openapi.oas.json -d "$RUNNER_TEMP/spec"

      - name: Listing text checks
        run: python3 -I ios/store/check_listing.py ios/store/listing.md

      - name: Plan or apply the listing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_REVIEW_USER: ${{ secrets.ASC_REVIEW_USER }}
          ASC_REVIEW_PASSWORD: ${{ secrets.ASC_REVIEW_PASSWORD }}
          ASC_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_FIRST_NAME }}
          ASC_REVIEW_CONTACT_LAST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_LAST_NAME }}
          ASC_REVIEW_CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
          ASC_REVIEW_CONTACT_EMAIL: ${{ secrets.ASC_REVIEW_CONTACT_EMAIL }}
          VERSION: ${{ inputs.version }}
          EXPECT_BUILD_NUMBER: ${{ inputs.build_number }}
          MODE: ${{ inputs.dry_run && 'plan' || 'apply' }}
        run: |
          set -euo pipefail
          for n in ASC_REVIEW_PASSWORD ASC_REVIEW_USER ASC_REVIEW_CONTACT_PHONE ASC_REVIEW_CONTACT_EMAIL; do
            [ -n "${!n}" ] && echo "::add-mask::${!n}"
          done
          python3 -I ios/store/asc_listing.py "$MODE" --version "$VERSION" --shots-dir "$RUNNER_TEMP/shots" --spec "$RUNNER_TEMP/spec/openapi.oas.json"
